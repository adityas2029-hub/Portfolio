<script type="text/babel">
const { useState: useStateNav, useEffect: useEffectNav, useRef: useRefNav } = React;

/* Magnetic hover — the element subtly pulls toward the cursor when hovered.
   Borrowed from Linear / Vercel / premium portfolios. Subtle on purpose
   (max 6px translation, 4 deg of inner-text shift) — feels alive without
   being tacky. Skips touch devices. */
function useMagnetic(strength = 0.25, max = 6) {
  const ref = useRefNav(null);
  useEffectNav(() => {
    const el = ref.current;
    if (!el) return undefined;
    // Skip on coarse pointers — magnetic with touch is just lag.
    if (!window.matchMedia("(hover: hover) and (pointer: fine)").matches) return undefined;
    let raf = 0, tx = 0, ty = 0, cx = 0, cy = 0;
    const tick = () => {
      cx += (tx - cx) * 0.18;
      cy += (ty - cy) * 0.18;
      el.style.transform = `translate3d(${cx}px, ${cy}px, 0)`;
      if (Math.abs(tx - cx) > 0.05 || Math.abs(ty - cy) > 0.05) {
        raf = requestAnimationFrame(tick);
      } else {
        raf = 0;
      }
    };
    const onMove = (e) => {
      const r = el.getBoundingClientRect();
      const dx = (e.clientX - (r.left + r.width / 2)) * strength;
      const dy = (e.clientY - (r.top + r.height / 2)) * strength;
      tx = Math.max(-max, Math.min(max, dx));
      ty = Math.max(-max, Math.min(max, dy));
      if (!raf) raf = requestAnimationFrame(tick);
    };
    const onLeave = () => { tx = 0; ty = 0; if (!raf) raf = requestAnimationFrame(tick); };
    el.addEventListener("mousemove", onMove);
    el.addEventListener("mouseleave", onLeave);
    return () => {
      el.removeEventListener("mousemove", onMove);
      el.removeEventListener("mouseleave", onLeave);
      cancelAnimationFrame(raf);
    };
  }, [strength, max]);
  return ref;
}

function TopNav({ onToggleTheme, themeMode, onCta }) {
  const [scrolled, setScrolledNav] = useStateNav(false);
  const [onAccent, setOnAccent] = useStateNav(false);
  const ctaRef = useMagnetic(0.25, 6);
  useEffectNav(() => {
    const handler = () => {
      setScrolledNav(window.scrollY > 24);
      const c = document.getElementById("contact");
      if (c) {
        const r = c.getBoundingClientRect();
        setOnAccent(r.top < 60 && r.bottom > 60);
      }
    };
    handler();
    window.addEventListener("scroll", handler, { passive: true });
    return () => window.removeEventListener("scroll", handler);
  }, []);
  return (
    <header className={`topnav ${scrolled ? "scrolled" : ""} ${onAccent ? "on-accent" : ""}`}>
      <a href="#hero" className="logo" aria-label="ADI UIXUX home">
        <span className="logo-mark"><span>A</span></span>
        <span className="logo-text" aria-hidden="true">
          {"ADI UIXUX".split("").map((c, i) => (
            <span key={i} className="lt-ch" style={{ "--i": i }}>{c === " " ? " " : c}</span>
          ))}
        </span>
      </a>
      <nav className="topnav-center" aria-label="Primary">
        <a href="#work">Work</a>
        <a href="#collage">Brand</a>
        <a href="#about">About</a>
      </nav>
      <div className="topnav-right">
        <button className="theme-toggle" onClick={onToggleTheme}
          aria-label={`Theme: ${themeMode}. Click to cycle.`}
          data-onboard="theme">
          <ThemeIcon mode={themeMode} />
        </button>
        <a href="#contact" className="cta" onClick={onCta} data-onboard="cta" ref={ctaRef}>
          <span className="cta-inner">
            <span className="dot"></span>
            <span className="cta-text">
              <span className="a">Let's work together</span>
              <span className="b">Say hello</span>
            </span>
            <span className="arrow" aria-hidden="true">→</span>
          </span>
        </a>
      </div>
    </header>
  );
}

function ThemeIcon({ mode }) {
  if (mode === "auto") return (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6">
      <circle cx="12" cy="12" r="6" />
      <path d="M12 6 a6 6 0 0 1 0 12" fill="currentColor" />
    </svg>
  );
  if (mode === "dark") return (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6">
      <path d="M16 14A8 8 0 0 1 10 4a8 8 0 1 0 8 10z" fill="currentColor" stroke="none" />
    </svg>
  );
  return (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6">
      <circle cx="12" cy="12" r="4" fill="currentColor" stroke="none" />
      <g stroke="currentColor" strokeLinecap="round">
        <line x1="12" y1="3" x2="12" y2="5" /><line x1="12" y1="19" x2="12" y2="21" />
        <line x1="3" y1="12" x2="5" y2="12" /><line x1="19" y1="12" x2="21" y2="12" />
        <line x1="5.6" y1="5.6" x2="6.8" y2="6.8" /><line x1="17.2" y1="17.2" x2="18.4" y2="18.4" />
        <line x1="5.6" y1="18.4" x2="6.8" y2="17.2" /><line x1="17.2" y1="6.8" x2="18.4" y2="5.6" />
      </g>
    </svg>
  );
}

function SideRail({ items, active, onJump }) {
  const [onAccentR, setOnAccentR] = useStateNav(false);
  useEffectNav(() => {
    const handler = () => {
      const c = document.getElementById("contact");
      if (!c) return;
      const r = c.getBoundingClientRect();
      setOnAccentR(r.top < window.innerHeight / 2 && r.bottom > window.innerHeight / 2);
    };
    handler();
    window.addEventListener("scroll", handler, { passive: true });
    return () => window.removeEventListener("scroll", handler);
  }, []);
  return (
    <aside className={`siderail ${onAccentR ? "on-accent" : ""}`} aria-label="Section navigator" data-onboard="rail">
      {items.map((it, i) => {
        const isActive = active === it.id;
        return (
          <a key={it.id} href={`#${it.id}`}
             onClick={(e) => { e.preventDefault(); onJump(it.id); }}
             className={`rail-item ${isActive ? "active" : ""}`}>
            <span className="rail-track">
              <span className="rail-track-fill" style={{ width: isActive ? "100%" : "0%" }} />
            </span>
            <span className="rail-label">{it.label}</span>
          </a>
        );
      })}
    </aside>
  );
}

function MobileNav({ items, active, onJump }) {
  const [open, setOpen] = useStateNav(false);
  useEffectNav(() => {
    document.body.style.overflow = open ? "hidden" : "";
    return () => { document.body.style.overflow = ""; };
  }, [open]);
  return (
    <>
      <button className={`hamburger ${open ? "open" : ""}`} aria-label="Menu"
              aria-expanded={open} onClick={() => setOpen(!open)}>
        <span></span><span></span><span></span>
      </button>
      <div className={`mobile-menu ${open ? "open" : ""}`} aria-hidden={!open}>
        <nav>
          {items.map((it, i) => (
            <a key={it.id} href={`#${it.id}`}
               onClick={(e) => { e.preventDefault(); setOpen(false); onJump(it.id); }}
               style={{ color: active === it.id ? "var(--fg)" : "var(--muted)" }}>
              <span className="num">{String(i + 1).padStart(2, "0")}</span>
              <span>{it.label}</span>
            </a>
          ))}
        </nav>
        <div className="menu-foot">
          <span>Bangalore · IN</span>
          <span>©2026</span>
        </div>
      </div>
    </>
  );
}

Object.assign(window, { TopNav, SideRail, MobileNav });
</script>

<script type="text/babel">
const { useRef: useRefHero, useEffect: useEffectHero, useCallback: useCallbackHero, useState: useStateHero } = React;

const HEADLINE = "Hello, I am a product, systems and experience designer, bridging the gap between ideas and functionality";

const SPECIAL = {
  "bridging": { kind: "serif", alt: "weaving" }
};

function tokenize(s) {
  const tokens = [];
  let buf = "", mode = null;
  for (const ch of s) {
    const m = /\s/.test(ch) ? "s" : /[a-zA-Z0-9'']/.test(ch) ? "w" : "p";
    if (m !== mode) { if (buf) tokens.push({ t: buf, m: mode }); buf = ch; mode = m; }
    else buf += ch;
  }
  if (buf) tokens.push({ t: buf, m: mode });
  return tokens;
}

function splitChars(s) {
  // Per-character index is exposed via CSS custom property so the hover
  // cascade can stagger transition-delay without hard-coding nth-child rules.
  return s.split("").map((c, i) => (
    <span key={i} className="ch" style={{ "--ch-i": i }}>{c}</span>
  ));
}

function Hero({ animation = "wave" }) {
  const textRef = useRefHero(null);
  const [clock, setClock] = useStateHero(() => bangaloreClock());

  useEffectHero(() => {
    // Tick once per minute — visible enough to feel alive, not jittery.
    const id = setInterval(() => setClock(bangaloreClock()), 60 * 1000);
    return () => clearInterval(id);
  }, []);

  const handleEnter = useCallbackHero(() => {
    const chars = textRef.current?.querySelectorAll(".ch");
    if (!chars || !chars.length) return;
    const N = chars.length;
    chars.forEach((c, i) => {
      const phase = i / N;
      const dy = Math.sin(phase * Math.PI * 2) * 2.5;
      c.style.transitionDelay = `${i % 30 * 10}ms`;
      c.style.transform = `translateY(${dy}px)`;
      setTimeout(() => { c.style.transform = "translateY(0)"; }, 380 + i % 30 * 10);
    });
  }, []);

  const tokens = tokenize(HEADLINE);

  return (
    <section id="hero" className="hero" data-screen-label="01 Hero">
      <div className="hero-eyebrow">
        <span className="dash"></span>
        <span>{clock.greeting} · Bangalore · <span className="clock-time">{clock.time}</span></span>
        <span className="blink"></span>
      </div>

      <h1
        className="intro-text"
        ref={textRef}
        onMouseEnter={handleEnter}
        aria-label={HEADLINE + "."}>
        {tokens.map((tok, i) => {
          if (tok.m === "s") return <span key={i} className="space"> </span>;
          if (tok.m === "p") return <span key={i} className="punc">{splitChars(tok.t)}</span>;
          const spec = SPECIAL[tok.t.toLowerCase()];
          if (spec) return (
            <span key={i} className={`word ${spec.kind}`} data-special={spec.kind} data-ghost={tok.t}>
              <span className="orig">{splitChars(tok.t)}</span>
              {spec.alt && <span className="alt" aria-hidden="true">{spec.alt}</span>}
            </span>
          );
          return (
            <span key={i} className="word" data-ghost={tok.t}>
              <span className="orig">{splitChars(tok.t)}</span>
            </span>
          );
        })}
        <span className="period" aria-hidden="true"></span>
      </h1>

      <p className="hero-sub">
        I help teams design <em>thoughtful, opinionated</em> products in fintech,
        mobility and consumer. Strategy first. Pixel-stubborn second.
      </p>

      <div className="hero-footer">
        <div className="col">

/* Live Bangalore clock + time-aware greeting for the hero eyebrow */
function bangaloreClock() {
  const now = new Date();
  const utc = now.getTime() + now.getTimezoneOffset() * 60000;
  const ist = new Date(utc + (5.5 * 60 * 60 * 1000));
  const h = ist.getHours();
  const m = String(ist.getMinutes()).padStart(2, "0");
  const ampm = h < 12 ? "AM" : "PM";
  const hh = String(((h + 11) % 12) + 1).padStart(2, "0");

  let greeting;
  if (h >= 5 && h < 12) greeting = "Good morning";
  else if (h >= 12 && h < 17) greeting = "Good afternoon";
  else if (h >= 17 && h < 21) greeting = "Good evening";
  else greeting = "Burning the midnight oil";

  return { time: `${hh}:${m} ${ampm}`, greeting };
}

function CollageThumb({ item }) {
  const [failed, setFailed] = useStateCol(false);
  if (!item.img || failed) return <ArtSwatch variant={item.swatch} name={item.name} />;

    <img
      src={item.img}
      alt={`${item.name} — ${item.cat}`}
      loading="lazy"
      onError={() => setFailed(true)}

  );
}

  const [progress, setProgress] = useStateCol(0);
  const [paused, setPaused] = useStateCol(false);
  const [view, setView] = useStateCol("grid"); // 'grid' (default, auto-scrolls) | 'strip'
  const dragState = useRefCol({ active: false, startX: 0, startLeft: 0, moved: 0 });

  // Auto-scroll loop only when in strip view
  useEffectCol(() => {
    if (view !== "strip") return undefined;
    const el = trackRef.current;
    if (!el) return undefined;
    let raf = 0, last = performance.now();
    const tick = (now) => {
      const dt = now - last; last = now;
      if (!paused && !dragState.current.active) {
        const max = el.scrollWidth - el.clientWidth;
        if (max > 0) {
          let next = el.scrollLeft + (dt / 1000) * 30;
          if (next >= max - 1) next = 0;
          el.scrollLeft = next;
        }
      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [paused, view]);

  // Drag-to-scroll only for strip view
  useEffectCol(() => {
    if (view !== "strip") return undefined;
    const el = trackRef.current;
    if (!el) return undefined;
    const onDown = (e) => {
      dragState.current = { active: true, startX: e.touches ? e.touches[0].clientX : e.clientX, startLeft: el.scrollLeft, moved: 0 };
      el.classList.add("dragging"); setPaused(true);
    };
    const onMove = (e) => {
      if (!dragState.current.active) return;
      const x = e.touches ? e.touches[0].clientX : e.clientX;
      const dx = x - dragState.current.startX;
      dragState.current.moved = Math.abs(dx);
      el.scrollLeft = dragState.current.startLeft - dx;
      if (e.cancelable && e.touches) e.preventDefault();
    };
    const onUp = () => {
      if (!dragState.current.active) return;
      dragState.current.active = false;
      el.classList.remove("dragging");
      if (dragState.current.moved > 4) {
        el.querySelectorAll(".collage-card").forEach((c) => (c.style.pointerEvents = "none"));
        setTimeout(() => el.querySelectorAll(".collage-card").forEach((c) => (c.style.pointerEvents = "")), 50);
      }
    };
    el.addEventListener("mousedown", onDown);
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
    el.addEventListener("touchstart", onDown, { passive: true });
    el.addEventListener("touchmove", onMove, { passive: false });
    el.addEventListener("touchend", onUp);
    return () => {
      el.removeEventListener("mousedown", onDown);
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
    };
  }, [view]);

  // Per-view: progress for the strip; "armed" gate for the brand marquee so
  // the column entrance + vertical auto-scroll only kick in when the brand
  // section enters the viewport (not on page load, deep above the fold).
  useEffectCol(() => {
    const cleanups = [];

    if (view === "strip") {
      const el = trackRef.current;
      if (el) {
        const onScroll = () => {
          const max = el.scrollWidth - el.clientWidth;
          setProgress(max > 0 ? el.scrollLeft / max : 0);
        };
        el.addEventListener("scroll", onScroll, { passive: true });
        cleanups.push(() => el.removeEventListener("scroll", onScroll));
      }
      // Strip-view: per-card fade-up when each scrolls into view.
      const obs = new IntersectionObserver((entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) {
            const idx = Number(e.target.getAttribute("data-i") || 0);
            setTimeout(() => e.target.classList.add("in"), idx * 60);
            obs.unobserve(e.target);
          }
        });
      }, { threshold: 0.12 });
      el?.querySelectorAll(".collage-card").forEach((card) => obs.observe(card));
      cleanups.push(() => obs.disconnect());
    } else {
      // Grid-view: arm the brand marquee when it enters the viewport.
      const container = gridRef.current;
      if (container) {
        const obs = new IntersectionObserver((entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) {
              e.target.classList.add("armed");
              obs.unobserve(e.target);
            }
          });
        }, { threshold: 0.1 });
        obs.observe(container);
        cleanups.push(() => obs.disconnect());
      }
    }
    return () => cleanups.forEach((c) => c());
  }, [view]);

  const scrollBy = (dx) => trackRef.current?.scrollBy({ left: dx, behavior: "smooth" });

  return (
    <section id="collage" data-screen-label="03 Brand">
      <div className="section-head">
        <div style={{ display: "flex", gap: 20, alignItems: "baseline" }}>
          <span className="num" style={{ color: "var(--accent)" }}>§ 03 / Brand</span>
          <h2><LetterReveal text="Side things, marks & posters" /></h2>
        </div>
        <div className="meta" style={{ display: "flex", alignItems: "center", gap: 16 }}>
          <span>{COLLAGE.length} works · {view === "strip" ? "scroll →" : "3-col grid"}</span>
          <div className="collage-view-toggle" role="group" aria-label="View mode">
            <button
              type="button"
              aria-pressed={view === "strip"}
              aria-label="Horizontal strip view"
              onClick={() => setView("strip")}
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8">
                <rect x="3" y="8" width="6" height="8" />
                <rect x="11" y="8" width="6" height="8" />
                <rect x="19" y="8" width="6" height="8" />
              </svg>
            </button>
            <button
              type="button"
              aria-pressed={view === "grid"}
              aria-label="3-column grid view"
              onClick={() => setView("grid")}
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8">
                <rect x="3" y="3" width="5" height="5" />
                <rect x="10" y="3" width="5" height="5" />
                <rect x="17" y="3" width="5" height="5" />
                <rect x="3" y="10" width="5" height="5" />
                <rect x="10" y="10" width="5" height="5" />
                <rect x="17" y="10" width="5" height="5" />
              </svg>
            </button>
          </div>
        </div>
      </div>

      {view === "strip" ? (
        /* Single-line strip — bigger cards, each carrying name + a catchy
           tagline. Horizontal scroller with auto-pace + drag. */
        <div className="collage-wrap collage-wrap-strip"
             onMouseEnter={() => setPaused(true)}
             onMouseLeave={() => setPaused(false)}>
          <div className="collage-track" ref={trackRef}>
            {COLLAGE.map((it, i) => (
              <article key={it.id} className="collage-card collage-card-large" data-i={i}>
                <div className="thumb">
                  <CollageThumb item={it} />
                </div>
                <div className="meta-block">
                  <div className="meta-row">
                    <span className="name">{it.name}</span>
                    <span className="yr">{it.cat} · '{it.year}</span>
                  </div>
                  <p className="tagline">{it.tag}</p>
                </div>
                <div className="reveal" aria-hidden="true">
                  <span className="reveal-cat">{it.cat} · {it.year}</span>
                  <span className="reveal-name">{it.name}</span>
                  <span className="reveal-arrow">↗</span>
                </div>
              </article>
            ))}
          </div>
        </div>
      ) : (
        <div className="brand-marquee" ref={gridRef}>
          {[0, 1, 2].map((colIdx) => {
            /* Distribute 12 items across 3 columns (4 each) by stride so adjacent
               columns get visually different mixes (identity / poster / editorial …) */
            const colItems = COLLAGE.filter((_, i) => i % 3 === colIdx);
            return (
              <div key={colIdx} className={`brand-col col-${colIdx + 1}`}>
                {/* Items duplicated so the keyframe -50% translateY loops seamlessly */}
                {[...colItems, ...colItems].map((it, j) => (
                  <article key={`${colIdx}-${j}`} className="collage-card brand-card">
                    <div className="thumb">
                      <CollageThumb item={it} />
                    </div>
                    <div className="meta">
                      <span className="name">{it.name}</span>
                      <span className="yr">{it.cat} · '{it.year}</span>
                    </div>
                    <div className="reveal" aria-hidden="true">
                      <span className="reveal-cat">{it.cat} · {it.year}</span>
                      <span className="reveal-name">{it.name}</span>
                      <span className="reveal-arrow">↗</span>
                    </div>
                  </article>
                ))}
              </div>
            );
          })}
        </div>
      )}

      {view === "strip" && (
        <div className="collage-controls">
          <span>// Auto-scrolls · drag to grab · or use arrows</span>
          <div className="collage-progress">
            <div className="bar" style={{ width: `${Math.max(8, progress * 100)}%` }} />
          </div>
          <div className="collage-arrows">
            <button onClick={() => scrollBy(-400)} aria-label="Previous">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7"><path d="M19 12H5M11 6l-6 6 6 6" /></svg>
            </button>
            <button onClick={() => scrollBy(400)} aria-label="Next">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
            </button>
          </div>
        </div>
      )}
    </section>
  );
}

<script type="text/babel">
const { useEffect: useEffectOb, useState: useStateOb } = React;

const BUBBLES = [
  { sel: '[data-onboard="rail"]',  text: "Quick travel — every section is one click.", place: "right",  offset: [80, -10] },
  { sel: '[data-onboard="theme"]', text: "Auto-flips at 7pm. Tap to override.",          place: "bottom", offset: [-180, 44] },
  { sel: '[data-onboard="cta"]',   text: "Bypass the scroll — say hello right away.",   place: "bottom", offset: [-160, 44] },
  { sel: ".intro-text",            text: "Hover the words. Some swap, some shift.",      place: "bottom", offset: [0, 24] },
];

function OnboardingBubbles({ enabled, replayKey }) {
  const [coords, setCoords] = useStateOb([]);
  const [dismissed, setDismissed] = useStateOb(new Set());

  useEffectOb(() => {
    if (!enabled) return;
    if (localStorage.getItem("adi-onboarded") === "1" && replayKey === 0) return;

    let mounted = true;
    let timeouts = [];

    const compute = () => {
      const cs = BUBBLES.map((b) => {
        const el = document.querySelector(b.sel);
        if (!el) return null;
        const r = el.getBoundingClientRect();
        return { ...b, x: r.left + (b.offset[0] || 0), y: r.top + r.height + (b.offset[1] || 0) };
      });
      if (mounted) setCoords(cs);
    };
    compute();
    window.addEventListener("resize", compute);

    BUBBLES.forEach((_, i) => {
      timeouts.push(setTimeout(() => {
        if (!mounted) return;
        setCoords((curr) => curr.map((c, j) => (j === i ? { ...c, _show: true } : c)));
      }, 600 + i * 420));
      timeouts.push(setTimeout(() => {
        if (!mounted) return;
        setCoords((curr) => curr.map((c, j) => (j === i ? { ...c, _show: false } : c)));
      }, 7200 + i * 420));
    });

    const finalize = setTimeout(() => localStorage.setItem("adi-onboarded", "1"), 12000);
    return () => { mounted = false; timeouts.forEach(clearTimeout); clearTimeout(finalize); window.removeEventListener("resize", compute); };
  }, [enabled, replayKey]);

  if (!enabled) return null;
  return (
    <>
      {coords.map((c, i) => {
        if (!c || dismissed.has(i)) return null;
        return (
          <div key={i} className={`bubble from-top ${c._show ? "show" : ""}`}
               style={{ left: Math.max(8, c.x), top: c.y }}
               onClick={() => setDismissed((s) => new Set(s).add(i))}>
            {c.text}
            <span className="close">· ✕</span>
          </div>
        );
      })}
    </>
  );
}

Object.assign(window, { OnboardingBubbles });
</script>

  { id: "contact", label: "Contact" },
  { id: "about",   label: "About" },
];

const DEFAULTS = {
  heroAnimation: "wave",
  themeMode: "auto",
  showOnboarding: true,

/* Floating cursor — a small ring + dot that follows the pointer with subtle
   lag. State shifts based on what's beneath:
     default      → small ring, fg outline
     link/button  → enlarges, fills with fg (a "tap target" cue)
     accent zone  → fills with accent (matches the contact section's orange)
     text input   → becomes a vertical "I-beam" bar
   Disabled on touch/coarse-pointer devices via @media (hover:none) in CSS. */
/* Konami code easter egg — type the classic sequence anywhere on the page
   to reveal a small mono-typed toast in the bottom-left. Tasteful, not loud:
   one line, fades after 4s, no confetti. */
function KonamiEgg() {
  const [revealed, setRevealed] = useState(false);
  useEffect(() => {
    const SEQ = ["ArrowUp","ArrowUp","ArrowDown","ArrowDown","ArrowLeft","ArrowRight","ArrowLeft","ArrowRight","b","a"];
    let buf = [];
    const onKey = (e) => {
      // Ignore typing in inputs/textareas — easter eggs shouldn't fight user input.
      const t = e.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
      buf.push(e.key);
      if (buf.length > SEQ.length) buf = buf.slice(-SEQ.length);
      if (buf.length === SEQ.length && buf.every((k, i) => k.toLowerCase() === SEQ[i].toLowerCase())) {
        setRevealed(true);
        buf = [];
        setTimeout(() => setRevealed(false), 4400);
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);
  return (
    <div className={`konami-toast ${revealed ? "show" : ""}`} aria-hidden={!revealed}>
      <span className="dot">●</span>
      <span>You're paying attention. <em>That's the whole point.</em></span>
    </div>
  );
}

/* Scroll-to-top — appears after scrolling past the hero, smooth-scrolls home. */
/* Top scroll-progress bar — a single hairline fills with accent as you scroll.
   Quiet and unobtrusive; lives at the very top above the topnav. */
function ScrollProgress() {
  const barRef = useRef(null);
  useEffect(() => {
    const onScroll = () => {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      const p = max > 0 ? window.scrollY / max : 0;
      if (barRef.current) barRef.current.style.transform = `scaleX(${p})`;
    };
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll);
    return () => {
      window.removeEventListener("scroll", onScroll);
      window.removeEventListener("resize", onScroll);
    };
  }, []);
  return (
    <div className="scroll-progress" aria-hidden="true">
      <div className="scroll-progress-bar" ref={barRef} />
    </div>
  );
}

/* GridReveal — the design system, made visible.
   The whole site is built on a 12-column Müller-Brockmann grid; the rule
   normally lives only in the CSS. Pressing G (or Escape to dismiss) toggles
   an overlay that paints the grid + 8pt baseline so the construction becomes
   inspectable. Clicking an empty area gives a 1.2s flash of the column you
   clicked in — a peek at the grid without committing to the full mode.

   References Müller-Brockmann's 'Grid Systems' (1961). Pure designer fan-
   service: it teaches and signals craft without taking screen real estate. */
function GridReveal() {
  const [full, setFull] = useState(false);

  // Press G to toggle (skipped when typing). Escape closes.
  useEffect(() => {
    const onKey = (e) => {
      const t = e.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === "g" || e.key === "G") {
        e.preventDefault();
        setFull((v) => !v);
      } else if (e.key === "Escape" && full) {
        setFull(false);
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [full]);

  // Body class drives the full-grid overlay
  useEffect(() => {
    document.body.classList.toggle("grid-mode", full);
    return () => document.body.classList.remove("grid-mode");
  }, [full]);

  // Click anywhere on an empty area → flash a vertical accent strip
  // at the click X for ~1.2s. Skips real interactive elements.
  useEffect(() => {
    if (full) return undefined;
    if (!window.matchMedia("(hover: hover) and (pointer: fine)").matches) return undefined;

    const isInteractive = (el) => {
      while (el && el !== document.body) {
        if (el.matches?.(
          "a, button, [role='button'], input, textarea, select, summary, label, " +
          ".case, .collage-card, .method-tile, .rail-item, .hamburger, " +
          ".theme-toggle, .cta, .topnav-center a, .submit, .footer-year-egg, " +
          ".collage-view-toggle, .scroll-top, .twk-panel, .bubble"
        )) return true;
        el = el.parentElement;
      }
      return false;
    };

    const onClick = (e) => {
      if (e.button !== 0) return;
      if (isInteractive(e.target)) return;
      const flash = document.createElement("div");
      flash.className = "grid-flash";
      flash.style.left = e.clientX + "px";
      flash.addEventListener("animationend", () => flash.remove(), { once: true });
      document.body.appendChild(flash);
    };
    window.addEventListener("click", onClick);
    return () => window.removeEventListener("click", onClick);
  }, [full]);

  return (
    <>
      <div className="grid-overlay" aria-hidden="true">
        <div className="grid-overlay-cols">
          {Array.from({ length: 12 }, (_, i) => <span key={i} />)}
        </div>
      </div>
      <div className={`grid-mode-badge ${full ? "show" : ""}`} role="status">
        <span className="gm-label">12-col · 8pt baseline</span>
        <span className="gm-key">Press <kbd>G</kbd> to close</span>
      </div>
    </>
  );
}

function ScrollTop() {
  const [shown, setShown] = useState(false);
  useEffect(() => {
    const onScroll = () => setShown(window.scrollY > window.innerHeight * 0.6);
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  const onClick = () => window.scrollTo({ top: 0, behavior: "smooth" });
  return (
    <button
      type="button"
      className={`scroll-top ${shown ? "shown" : ""}`}
      aria-label="Scroll to top"
      onClick={onClick}
    >
      <span className="scroll-top-progress" aria-hidden="true" />
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8">
        <path d="M12 19V5M5 12l7-7 7 7" />
      </svg>
    </button>
  );
}

function FloatingCursor() {
  const ringRef = useRef(null);
  const dotRef = useRef(null);
  const state = useRef({
    x: -100, y: -100, tx: -100, ty: -100, raf: 0, kind: "default", visible: false,
  });

  useEffect(() => {
    // Skip on touch-only devices — feels off without precise pointer.
    const fine = window.matchMedia("(hover: hover) and (pointer: fine)");
    if (!fine.matches) return undefined;

    const ring = ringRef.current;
    const dot = dotRef.current;
    if (!ring || !dot) return undefined;

    const setKind = (next) => {
      if (state.current.kind === next) return;
      state.current.kind = next;
      ring.setAttribute("data-kind", next);
      dot.setAttribute("data-kind", next);
    };

    const inferKind = (el) => {
      if (!el) return "default";
      // Walk up the tree to find an interactive ancestor
      let n = el;
      while (n && n !== document.body) {
        if (n.matches?.("textarea, input[type='text'], input[type='email'], input[type='tel'], input[type='search'], [contenteditable='true']"))
          return "text";
        // The contact section has its own orange bg — accent treatment fits there
        if (n.matches?.(".contact-section, .contact-section *")) {
          if (n.matches?.("a, button, [role='button'], .method-tile, .submit, .case, .collage-card, .topnav-center a"))
            return "accent-link";
          return "accent";
        }
        if (n.matches?.("a, button, [role='button'], .case, .collage-card, .rail-item, .hamburger, .theme-toggle, .cta, .topnav-center a, .submit, .method-tile, summary, label, [data-cursor='link']"))
          return "link";
        n = n.parentElement;
      }
      return "default";
    };

    const onMove = (e) => {
      state.current.tx = e.clientX;
      state.current.ty = e.clientY;
      if (!state.current.visible) {
        state.current.visible = true;
        ring.style.opacity = "1";
        dot.style.opacity = "1";
      }
      setKind(inferKind(e.target));
    };
    const onLeave = () => {
      state.current.visible = false;
      ring.style.opacity = "0";
      dot.style.opacity = "0";
    };
    const onDown = () => ring.setAttribute("data-pressed", "true");
    const onUp = () => ring.removeAttribute("data-pressed");

    const tick = () => {
      const s = state.current;
      // Two lerp speeds — the dot tracks fast, the ring trails behind for organic feel
      s.x += (s.tx - s.x) * 0.22;
      s.y += (s.ty - s.y) * 0.22;
      const ringX = s.x + (s.tx - s.x) * 0.0; // ring uses the integrated value above
      const ringY = s.y + (s.ty - s.y) * 0.0;
      ring.style.transform = `translate3d(${ringX}px, ${ringY}px, 0) translate(-50%, -50%)`;
      dot.style.transform = `translate3d(${s.tx}px, ${s.ty}px, 0) translate(-50%, -50%)`;
      s.raf = requestAnimationFrame(tick);
    };
    state.current.raf = requestAnimationFrame(tick);

    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseleave", onLeave);
    window.addEventListener("mousedown", onDown);
    window.addEventListener("mouseup", onUp);
    return () => {
      cancelAnimationFrame(state.current.raf);
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseleave", onLeave);
      window.removeEventListener("mousedown", onDown);
      window.removeEventListener("mouseup", onUp);
    };
  }, []);

  return (
    <>
      <div className="fcursor-ring" ref={ringRef} aria-hidden="true" />
      <div className="fcursor-dot" ref={dotRef} aria-hidden="true" />
    </>
  );
}

/* Marquee — a continuously-scrolling editorial strip that lives between
   sections. Duplicates its children so the loop is seamless. Pauses on hover. */
/* LetterReveal — splits text into chars wrapped in masked spans.
   Each word is its own inline-block container so letters can never break
   across lines mid-word (the bug that turned "Say hello" into a vertical
   acrostic on narrow viewports). Regular " " characters between words let
   normal text wrapping happen. */
function LetterReveal({ text }) {
  const words = text.split(" ");
  let charIdx = 0;
  return (
    <>
      {words.map((w, wi) => (
        <React.Fragment key={wi}>
          <span className="lr-word">
            {[...w].map((c, ci) => {
              const i = charIdx++;
              return (
                <span key={ci} className="lh">
                  <span style={{ "--i": i }}>{c}</span>
                </span>
              );
            })}
          </span>
          {wi < words.length - 1 && " "}
        </React.Fragment>
      ))}
    </>
  );
}
Object.assign(window, { LetterReveal });

function Marquee() {
  const ITEMS = [
    "Selected work, below",
    "Three projects",
    "Designed in Bangalore",
    "Open for Q3 '26",
    "Designing since 2019",
    "Strategy first",
    "Pixel-stubborn second",
    "Product · Systems · Experience",
  ];
  return (
    <aside className="marquee" aria-hidden="true">
      <div className="marquee-track">
        {[...ITEMS, ...ITEMS, ...ITEMS].map((t, i) => (
          <span key={i} className="marquee-item">
            <span className="dot">●</span>
            <span>{t}</span>
          </span>
        ))}
      </div>
    </aside>
  );
}
Object.assign(window, { Marquee });

function App() {
  const [tweaks, setTweak] = window.useTweaks(DEFAULTS);
  const { theme, mode, cycle } = window.useTheme(tweaks.themeMode);
  window.useToneBlend(theme);

  const { active } = window.useScrollSpy(NAV_ITEMS.map(n => n.id));
  const [replayOnboard, setReplayOnboard] = useStateApp(0);

  const jumpTo = useCallbackApp((id) => {
    const el = document.getElementById(id);
    if (!el) return;
    window.scrollTo({ top: el.offsetTop, behavior: "smooth" });
  }, []);

  /* Section reveal — fade-up each section-head on scroll-into-view */
  useEffectApp(() => {
    const sections = document.querySelectorAll("section:not(#hero)");
    const obs = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("revealed"); obs.unobserve(e.target); } });
    }, { threshold: 0.08 });
    sections.forEach((s) => obs.observe(s));
    return () => obs.disconnect();
  }, []);

  const onToggleTheme = () => {
    const order = ["auto", "light", "dark"];
    const idx = order.indexOf(tweaks.themeMode);
    const next = order[(idx + 1) % order.length];
    setTweak("themeMode", next);
    cycle();
  };

  return (
    <>
      <_TopNav themeMode={tweaks.themeMode} onToggleTheme={onToggleTheme}
               onCta={(e) => { e.preventDefault(); jumpTo("contact"); }} />
      <_MobileNav items={NAV_ITEMS} active={active} onJump={jumpTo} />
      <_SideRail items={NAV_ITEMS} active={active} onJump={jumpTo} />

      <main>
        <_Hero animation={tweaks.heroAnimation} />
        <Marquee />
        <_Work />
        <_Collage />
        <_Contact />
      </main>
      <_Footer />

      <ScrollProgress />
      <_OnboardingBubbles enabled={tweaks.showOnboarding} replayKey={replayOnboard} />
      <FloatingCursor />
      <GridReveal />
      <ScrollTop />
      <KonamiEgg />

      <TweaksPanel title="Tweaks">
        <TweakSection title="Hero Animation">
          <TweakRadio label="Style" value={tweaks.heroAnimation}
            onChange={(v) => setTweak("heroAnimation", v)}
            options={[{ value: "wave", label: "Wave" }, { value: "swap", label: "Swap" }, { value: "scramble", label: "Scramble" }]} />
        </TweakSection>
        <TweakSection title="Theme">
          <TweakRadio label="Mode" value={tweaks.themeMode}
            onChange={(v) => setTweak("themeMode", v)}
            options={[{ value: "auto", label: "Auto" }, { value: "light", label: "Light" }, { value: "dark", label: "Dark" }]} />
        </TweakSection>
        <TweakSection title="Onboarding">
          <TweakToggle label="Show prompts" value={tweaks.showOnboarding}
            onChange={(v) => setTweak("showOnboarding", v)} />
          <TweakButton onClick={() => { localStorage.removeItem("adi-onboarded"); setReplayOnboard(k => k + 1); }}>
            Replay prompts
          </TweakButton>
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

  "font:600 11px/1.4 monospace;color:#E94B1A;letter-spacing:0.18em;text-transform:uppercase;",

);

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
