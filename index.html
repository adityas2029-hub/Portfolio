<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ADI UIXUX — product, systems, experience.</title>
<meta name="description" content="Adi — product, systems and experience designer. Bangalore." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;450;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

<style>
/* ============================================================
   ADI UIXUX — Portfolio 2026
   Brutalist mono. High-contrast Swiss bones.
   ============================================================ */

:root {
  --bg: #F2EDE3;
  --bg-2: #EAE3D4;
  --fg: #16120E;
  --fg-2: #2A241E;
  --muted: #6E665C;
  --muted-2: #A89F92;
  --line: rgba(22,18,14,0.14);
  --line-strong: rgba(22,18,14,0.55);
  --accent: #E94B1A;
  --accent-ink: #0F0A07;
  --rail-fill: var(--fg);
  --bubble-bg: var(--fg);
  --bubble-fg: var(--bg);
  --hover: var(--fg);
  --grid: 8px;
  --pad-x: clamp(20px, 5vw, 40px);
  --pad-y: clamp(20px, 3vw, 32px);
  /* Header gets extra horizontal breathing room beyond the section grid */
  --pad-x-header: clamp(24px, 5.5vw, 48px);
  --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --font-display: "Instrument Serif", "Times New Roman", Georgia, serif;
  --transition: 220ms cubic-bezier(0.2, 0.7, 0.2, 1);
}

/* On desktop ensure left padding clears the side rail (14px wide at left:18px = ~32px),
   with generous Swiss-style breathing room */
@media (min-width: 901px) {
  :root {
    --pad-x: clamp(64px, 6.5vw, 96px);
    /* Header sits a touch further inboard than section content for visual weight on the edge */
    --pad-x-header: clamp(80px, 7.5vw, 128px);
  }
}

[data-theme="dark"] {
  --bg: #16120E;
  --bg-2: #1F1A14;
  --fg: #F2EDE3;
  --fg-2: #DCD5C7;
  --muted: #9A9285;
  --muted-2: #5E574E;
  --line: rgba(242,237,227,0.16);
  --line-strong: rgba(242,237,227,0.55);
  --accent: #FF6A36;
  --accent-ink: #0F0A07;
}

* { box-sizing: border-box; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--fg);
  /* Inter for body and headlines — professional, friendly proportions */
  font-family: var(--font-sans);
  font-weight: 400;
  font-size: 15px;
  line-height: 1.5;
  letter-spacing: -0.005em;
  font-feature-settings: "ss01", "cv11"; /* Inter's stylistic alternates: cleaner '1' and 'a' */
  transition: background 600ms ease, color 600ms ease;
  scroll-behavior: smooth;
  overflow-x: hidden;
}

/* Mono for "system" voice — labels, meta, eyebrows, numbers, section markers */
.mono, .eyebrow, .label,
.hero-eyebrow, .hero-footer,
.section-head .num, .section-head h2, .section-head .meta,
.case-num, .case .case-meta .tags,
.collage-card .meta, .collage-controls, .topnav-center, .cta,
.footer .col .hd, .footer-bottom, .menu-foot,
.contact-card .row .k, .bubble {
  font-family: var(--font-mono);
}

/* Section numbers use mono with tabular figures for crisp alignment */
.case-num, .hero-footer .v, .num, .footer-bottom { font-variant-numeric: tabular-nums; }

/* Focus — keyboard nav must be clearly visible at all times */
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

::selection { background: var(--fg); color: var(--bg); }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

/* ============================================================
   TYPE SCALE
   ============================================================ */
.eyebrow {
  font-size: 11px; font-weight: 500; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--muted);
}
.label { font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
.body { font-size: 14px; }
.body-lg { font-size: 16px; line-height: 1.55; }

/* ============================================================
   TOP NAV
   ============================================================ */
.topnav {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between;
  /* Use header-specific padding so the logo gets breathing room from the edge
     even when section content sits closer to the grid */
  padding: var(--pad-y) var(--pad-x-header);
  gap: 24px;
  z-index: 50;
  color: var(--fg);
  pointer-events: none;
  transition: background 320ms ease, border-color 320ms ease, color 320ms ease;
  border-bottom: 1px solid transparent;
}
/* Frosted nav: solid-bg fallback first, then color-mix for supporting browsers */
.topnav.scrolled {
  background: var(--bg);
  border-bottom-color: var(--line);
}
@supports (background: color-mix(in oklab, red 80%, transparent)) {
  .topnav.scrolled {
    background: color-mix(in oklab, var(--bg) 82%, transparent);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    backdrop-filter: blur(14px) saturate(140%);
  }
}
.topnav.on-accent {
  background: var(--accent);
  color: var(--accent-ink);
  border-bottom-color: rgba(15,10,7,0.18);
}
@supports (background: color-mix(in oklab, red 88%, transparent)) {
  .topnav.on-accent {
    background: color-mix(in oklab, var(--accent) 88%, transparent);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    backdrop-filter: blur(14px) saturate(140%);
  }
}
.topnav > * { pointer-events: auto; }
.topnav .logo {
  display: flex; align-items: center; gap: 10px;
  font-weight: 600; font-size: 13px; letter-spacing: 0.06em;
  text-transform: uppercase;
}
.logo-mark {
  width: 28px; height: 28px;
  border: 1.5px solid currentColor;
  display: grid; place-items: center;
  font-size: 11px; font-weight: 700;
  letter-spacing: 0; position: relative;
}
.logo-mark::after {
  content: ""; position: absolute; inset: -1.5px;
  border: 1.5px dashed currentColor; opacity: 0;
  transition: opacity var(--transition);
}
.logo:hover .logo-mark::after { opacity: 0.5; }
.logo-mark span { display: block; line-height: 1; }

/* Top-nav wordmark — per-character wave on hover.
   Each letter rises 3px and bolds, in a left-to-right stagger. The whole
   thing reads as a single "type wave" rather than a generic underline. */
.logo-text { display: inline-block; }
.logo-text .lt-ch {
  display: inline-block;
  font-variation-settings: "wght" 600;
  transition:
    transform 380ms cubic-bezier(0.2, 0.7, 0.2, 1),
    font-variation-settings 380ms cubic-bezier(0.2, 0.7, 0.2, 1),
    color 240ms ease;
  transition-delay: 0ms;
  will-change: transform, font-variation-settings;
}
.logo:hover .logo-text .lt-ch {
  transform: translateY(-3px);
  font-variation-settings: "wght" 760;
  transition-delay: calc(var(--i, 0) * 28ms);
}
.logo:hover .logo-text .lt-ch:nth-last-child(-n+3) {
  /* The 'UIXUX' suffix gets a soft accent tint at the tail of the wave */
  color: var(--accent);
}

.topnav-center {
  display: flex; gap: 28px;
  font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
}
.topnav-center a {
  position: relative; padding: 4px 0;
  transition: color 220ms ease;
}
.topnav-center a:hover { color: var(--accent); }
/* On the vermillion contact section, the topnav inverts to ink — keep
   hover legible by tinting toward a darker ink instead of the same orange */
.topnav.on-accent .topnav-center a:hover { color: var(--accent-ink); opacity: 0.7; }

.topnav-right { display: flex; align-items: center; gap: 18px; }
.theme-toggle {
  width: 32px; height: 32px; border: 1.5px solid currentColor; border-radius: 50%;
  display: grid; place-items: center; position: relative;
  transition: transform var(--transition);
}
.theme-toggle:hover { transform: rotate(45deg); }
.theme-toggle svg { width: 14px; height: 14px; }

.cta {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 10px 16px 10px 18px;
  font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
  font-weight: 500; position: relative; color: inherit;
  border: 1px solid var(--line-strong); background: transparent;
  transition: color 240ms ease, border-color 240ms ease, background 240ms ease,
              transform 380ms cubic-bezier(0.2, 0.7, 0.2, 1);
  will-change: transform;
}
.cta .cta-inner {
  display: inline-flex; align-items: center; gap: 10px;
  transition: transform 380ms cubic-bezier(0.2, 0.7, 0.2, 1);
}
/* Inner content parallaxes a touch more than the button itself, so the
   text/icon "lead" the cursor pull. Subtle — 0.35x of the outer translation. */
.cta:hover .cta-inner { transform: translate3d(0, 0, 0) scale(1.02); }
.cta .dot {
  width: 6px; height: 6px; background: var(--accent); border-radius: 50%;
  box-shadow: 0 0 0 0 var(--accent); animation: pulse 2.4s infinite;
}
@keyframes pulse {
  0%   { box-shadow: 0 0 0 0 rgba(233,75,26,0.45); }
  70%  { box-shadow: 0 0 0 7px rgba(233,75,26,0); }
  100% { box-shadow: 0 0 0 0 rgba(233,75,26,0); }
}
.cta .cta-text {
  position: relative; display: inline-block;
  overflow: hidden; height: 1.1em; line-height: 1.1;
}
.cta .cta-text .a,
.cta .cta-text .b { display: block; transition: transform 360ms cubic-bezier(0.7, 0, 0.2, 1); }
.cta .cta-text .b {
  position: absolute; left: 0; top: 100%; color: var(--accent);
}
.cta:hover .cta-text .a { transform: translateY(-100%); }
.cta:hover .cta-text .b { transform: translateY(-100%); }
.cta .arrow { display: inline-block; transition: transform 360ms cubic-bezier(0.7, 0, 0.2, 1), color 240ms ease; }
.cta:hover .arrow { transform: translateX(4px); color: var(--accent); }
.cta:hover { border-color: var(--accent); }

/* On the orange contact section the regular CTA becomes invisible
   (accent-on-accent). Re-skin it as ink-on-orange so it reads, then
   invert on hover to ink-bg + orange-text. */
.topnav.on-accent .cta { border-color: var(--accent-ink); color: var(--accent-ink); }
.topnav.on-accent .cta .dot { background: var(--accent-ink); animation: none; }
.topnav.on-accent .cta .cta-text .a,
.topnav.on-accent .cta .cta-text .b { color: var(--accent-ink); }
.topnav.on-accent .cta:hover { background: var(--accent-ink); border-color: var(--accent-ink); color: var(--accent); }
.topnav.on-accent .cta:hover .cta-text .a,
.topnav.on-accent .cta:hover .cta-text .b { color: var(--accent); }
.topnav.on-accent .cta:hover .arrow { color: var(--accent); }
.topnav.on-accent .cta:hover .dot { background: var(--accent); }

/* ============================================================
   SIDE PROGRESS RAIL
   ============================================================ */
.siderail {
  position: fixed; top: 50%; left: 18px; transform: translateY(-50%);
  z-index: 40; display: flex; flex-direction: column; gap: 14px;
  color: var(--fg); width: 14px; transition: color 320ms ease; padding: 12px 0;
}
.siderail.on-accent { color: var(--accent-ink); }
.rail-item {
  display: flex; align-items: center; gap: 12px; cursor: pointer;
  font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
  color: currentColor; opacity: 0.45; transition: opacity var(--transition);
  position: relative; height: 14px;
}
.rail-item:hover { opacity: 1; }
.rail-item.active { opacity: 1; }
.rail-track {
  width: 14px; height: 2px; background: currentColor; opacity: 0.4;
  position: relative; overflow: hidden;
  transition: width 280ms cubic-bezier(0.2, 0.7, 0.2, 1), opacity var(--transition);
  flex: 0 0 auto;
}
.rail-item:hover .rail-track { width: 28px; opacity: 0.9; }
.rail-item.active .rail-track { width: 36px; opacity: 1; }
.rail-track-fill {
  position: absolute; inset: 0; right: auto; background: currentColor; width: 0%;
}
.rail-label {
  white-space: nowrap; font-weight: 500; opacity: 0;
  transform: translateX(-4px);
  transition: opacity var(--transition), transform var(--transition);
  pointer-events: none; font-size: 10px;
}
.rail-item:hover .rail-label { opacity: 1; transform: translateX(0); }

/* ============================================================
   HAMBURGER (mobile)
   ============================================================ */
.hamburger {
  position: fixed; top: var(--pad-y); right: var(--pad-x-header); z-index: 60;
  width: 40px; height: 40px; display: none;
  flex-direction: column; justify-content: center; align-items: center;
  gap: 5px; color: var(--fg);
  /* Match the topnav vertical center so the icon aligns with the logo baseline */
  margin-top: -2px;
}
.hamburger span {
  display: block; width: 22px; height: 1.5px; background: currentColor;
  transition: transform var(--transition), opacity var(--transition);
}
.hamburger.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
.hamburger.open span:nth-child(2) { opacity: 0; }
.hamburger.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

.mobile-menu {
  position: fixed; inset: 0; background: var(--bg); color: var(--fg);
  z-index: 55; padding: calc(var(--pad-y) + 72px) var(--pad-x-header) var(--pad-x-header);
  display: flex; flex-direction: column;
  transform: translateY(-100%); transition: transform 420ms cubic-bezier(0.7, 0, 0.2, 1);
}
.mobile-menu.open { transform: translateY(0); }
.mobile-menu nav { display: flex; flex-direction: column; gap: 4px; margin-top: 24px; }
.mobile-menu nav a {
  display: flex; align-items: baseline; gap: 16px;
  font-size: clamp(28px, 7vw, 44px); font-weight: 500;
  letter-spacing: -0.02em; padding: 12px 0; border-bottom: 1px solid var(--line);
}
.mobile-menu nav a .num { font-size: 11px; font-weight: 500; letter-spacing: 0.1em; color: var(--muted); }
.mobile-menu .menu-foot {
  margin-top: auto; padding-top: 24px;
  display: flex; justify-content: space-between;
  font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
}

/* ============================================================
   SECTIONS
   ============================================================ */
section {
  position: relative;
  padding: clamp(80px, 12vw, 160px) var(--pad-x);
  min-height: 100vh;
}

.section-head {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: clamp(40px, 6vw, 72px); gap: 24px;
  border-top: 1px solid var(--line); padding-top: 24px;
}
/* Section number — smallest, muted: establishes hierarchy below the headline */
.section-head .num {
  font-size: 10px; letter-spacing: 0.18em; color: var(--muted);
  font-weight: 500; white-space: nowrap;
}
/* Section title — one step up: slightly larger, heavier, uppercase */
.section-head h2 {
  margin: 0; font-size: 13px;
  font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
}
/* Section meta — same weight as num, right-aligned counterpoint */
.section-head .meta {
  font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--muted); text-align: right; flex-shrink: 0;
}

/* ============================================================
   MARQUEE — editorial scrolling strip between sections
   ============================================================ */
.marquee {
  position: relative;
  overflow: hidden;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  background: var(--bg);
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 8%, #000 92%, transparent 100%);
          mask-image: linear-gradient(90deg, transparent 0, #000 8%, #000 92%, transparent 100%);
  /* Symmetric vertical breathing room — items sit visually centered between
     the top and bottom borders rather than hugging the top */
  display: flex; align-items: center;
  min-height: clamp(56px, 5vw, 72px);
}
.marquee-track {
  display: inline-flex; align-items: center; flex-wrap: nowrap; gap: 48px;
  white-space: nowrap; width: max-content;
  animation: marquee-scroll 60s linear infinite;
  will-change: transform;
}
.marquee:hover .marquee-track { animation-play-state: paused; }
.marquee-item {
  display: inline-flex; align-items: center; gap: 18px;
  font-family: var(--font-mono);
  font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--muted);
}
.marquee-item .dot { color: var(--accent); font-size: 8px; }
@keyframes marquee-scroll {
  from { transform: translateX(0); }
  to   { transform: translateX(-33.333%); }
}

/* ============================================================
   HERO — fixed layout, proper clearance from side nav
   ============================================================ */
.hero {
  display: flex; flex-direction: column; justify-content: center;
  padding-top: clamp(120px, 18vh, 200px);
  padding-bottom: clamp(60px, 10vh, 120px);
  /* horizontal padding comes from the section rule above */
  min-height: 100vh; position: relative;
}

.hero-eyebrow {
  display: flex; gap: 16px; align-items: center;
  font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--muted); margin-bottom: clamp(28px, 4vw, 48px);
}
.hero-eyebrow .dash { width: 28px; height: 1px; background: currentColor; display: inline-block; }
.hero-eyebrow .blink {
  width: 8px; height: 14px; background: var(--accent);
  animation: blink 1.1s steps(2) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

.intro-text {
  font-family: var(--font-sans);
  font-weight: 450;
  font-size: clamp(30px, 4.8vw, 72px);
  line-height: 1.06;
  letter-spacing: -0.03em;
  max-width: 20ch;
  margin: 0;
  text-wrap: pretty;
  color: var(--fg);
}
.intro-text .word { display: inline-block; position: relative; white-space: pre; }
.intro-text .space { white-space: pre; }
.intro-text .punc { display: inline-block; }

/* Hero word hover — cascading bold.
   Each character animates from weight 450 -> 700 with a left-to-right
   stagger driven by the CSS custom property --ch-i (set per <span class="ch">
   in JSX). No color change — the weight shift itself is the affordance.
   A hidden ::before "ghost" pre-allocates the bold width so neighbouring
   words don't reflow mid-cascade. */
.intro-text .word { position: relative; }
.intro-text .word .orig { display: inline-block; }
.intro-text .word::before {
  content: attr(data-ghost);
  display: inline-block; width: 0;
  visibility: hidden; pointer-events: none;
  font-weight: 700; font-variation-settings: "wght" 700;
  letter-spacing: -0.04em; /* match hover tracking so reservation is exact */
}
.intro-text .ch {
  display: inline-block;
  font-weight: 450; font-variation-settings: "wght" 450;
  transition:
    font-weight 320ms cubic-bezier(0.4, 0, 0.2, 1),
    font-variation-settings 320ms cubic-bezier(0.4, 0, 0.2, 1),
    letter-spacing 320ms cubic-bezier(0.4, 0, 0.2, 1),
    transform 380ms cubic-bezier(0.2, 0.7, 0.2, 1);
  transition-delay: 0ms; /* reset on mouse-leave so unbold snaps uniformly */
  will-change: font-variation-settings, transform;
}
.intro-text .word:hover .ch {
  font-weight: 700;
  font-variation-settings: "wght" 700;
  letter-spacing: -0.04em;
  /* Left-to-right stagger — 28ms per character */
  transition-delay: calc(var(--ch-i, 0) * 28ms);
}

/* The "bridging" word keeps its serif-italic swap — skip the bold cascade
   inside it to avoid double-animating during the cross-fade. */
.intro-text .word.serif .orig {
  display: inline-block;
  transition: opacity 320ms ease, transform 320ms ease;
}
.intro-text .word.serif:hover .orig { opacity: 0; transform: translateY(-6px); }
.intro-text .word.serif:hover .ch {
  font-weight: 450; font-variation-settings: "wght" 450; letter-spacing: -0.03em;
  transition-delay: 0ms;
}
.intro-text .word.serif .alt {
  position: absolute; left: 0; top: 0;
  font-family: var(--font-display); font-style: italic;
  font-weight: 400; letter-spacing: -0.01em;
  color: var(--accent); opacity: 0; transform: translateY(6px);
  transition: opacity 320ms ease, transform 320ms ease;
  white-space: nowrap; pointer-events: none; font-size: 1.08em;
}
.intro-text .word.serif:hover .alt { opacity: 1; transform: translateY(0); }

.intro-text .period {
  display: inline-block; width: 0.34em; height: 0.34em; background: var(--accent);
  vertical-align: 0.05em; margin-left: 0.06em; border-radius: 50%;
  position: relative; top: -0.05em;
}

.hero-sub {
  font-family: var(--font-sans); font-weight: 400;
  font-size: clamp(14px, 1.05vw, 17px); line-height: 1.6;
  letter-spacing: -0.005em; max-width: 56ch;
  color: var(--muted); margin: clamp(28px, 4vw, 44px) 0 0;
}
.hero-sub em {
  font-family: var(--font-display); font-style: italic;
  font-weight: 400; font-size: 1.12em;
  color: var(--fg); letter-spacing: -0.01em;
}

/* Hero footer — meta strip grounded at the bottom of the hero.
   The top border creates a clear figure/ground separation from the headline. */
.hero-footer {
  margin-top: auto;
  padding-top: clamp(32px, 5vh, 56px);
  margin-top: clamp(48px, 8vh, 96px);
  border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px;
  font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
}
.hero-eyebrow .clock-time { color: var(--accent); font-variant-numeric: tabular-nums; }
.hero-footer .col { display: flex; flex-direction: column; gap: 6px; }
.hero-footer .col .k { color: var(--muted); font-size: 10px; letter-spacing: 0.14em; }
.hero-footer .col .v { color: var(--fg); font-weight: 500; }
.hero-footer .col .v a { display: inline-flex; align-items: center; gap: 6px; }

.status-dot {
  display: inline-block; width: 6px; height: 6px;
  background: var(--accent); border-radius: 50%;
  animation: pulse 2.4s infinite; vertical-align: middle; margin-right: 4px;
}

/* ============================================================
   WORK / CASE STUDIES
   ============================================================ */
.work-list { display: flex; flex-direction: column; }
.case {
  display: grid; grid-template-columns: 72px 1fr 1.3fr;
  gap: clamp(24px, 4vw, 48px);
  padding: clamp(28px, 4vw, 44px) clamp(20px, 2vw, 32px) clamp(28px, 4vw, 44px) clamp(20px, 2vw, 32px);
  border-top: 1px solid var(--line);
  position: relative; cursor: pointer;
  /* Subtle entrance — barely a blur, just a quiet "settling" feel that reads
     as professional rather than gimmicky. IntersectionObserver adds .in. */
  opacity: 0;
  transform: translateY(14px);
  transition:
    padding 420ms cubic-bezier(0.2, 0.7, 0.2, 1),
    background 420ms ease,
    opacity 800ms cubic-bezier(0.2, 0.7, 0.2, 1),
    transform 800ms cubic-bezier(0.2, 0.7, 0.2, 1);
}
.case.in { opacity: 1; transform: translateY(0); }
@media (prefers-reduced-motion: reduce) {
  .case { opacity: 1; transform: none; transition: padding 420ms ease, background 420ms ease; }
}
/* Layer 1: full-width accent overlay that sweeps in from left */
.case::before {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg,
    color-mix(in oklab, var(--accent) 7%, transparent) 0%,
    transparent 60%);
  opacity: 0;
  transition: opacity 420ms ease;
  pointer-events: none;
  z-index: 0;
}
/* Layer 2: vertical accent bar on left edge that grows from top */
.case::after {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; background: var(--accent);
  transform: scaleY(0); transform-origin: top center;
  transition: transform 520ms cubic-bezier(0.65, 0, 0.35, 1);
  z-index: 1;
}
.case:hover { background: transparent; padding-left: clamp(32px, 3.5vw, 56px); }
.case:hover::before { opacity: 1; }
.case:hover::after { transform: scaleY(1); }
.case:last-child { border-bottom: 1px solid var(--line); }
.case > * { position: relative; z-index: 2; }
.case .case-num {
  font-size: 11px; letter-spacing: 0.18em; color: var(--muted); padding-top: 6px;
  transition: color 320ms ease, transform 420ms cubic-bezier(0.2, 0.7, 0.2, 1);
}
.case .case-meta { display: flex; flex-direction: column; gap: 14px; }
.case .case-meta .tags { display: flex; flex-wrap: wrap; gap: 6px; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.case .case-meta .tag {
  border: 1px solid var(--line); padding: 4px 8px;
  transition: border-color 320ms ease, color 320ms ease, background 320ms ease;
}
/* Tags stagger in colour on hover for a subtle "ripple" feel */
.case:hover .case-meta .tag { border-color: var(--accent); color: var(--accent); }
.case:hover .case-meta .tag:nth-child(1) { transition-delay: 0ms; }
.case:hover .case-meta .tag:nth-child(2) { transition-delay: 60ms; }
.case:hover .case-meta .tag:nth-child(3) { transition-delay: 120ms; }
.case:hover .case-meta .tag:nth-child(4) { transition-delay: 180ms; }
.case .case-title {
  font-family: var(--font-sans);
  font-size: clamp(26px, 3.2vw, 52px); font-weight: 500;
  line-height: 1.04; letter-spacing: -0.025em; margin: 0;
  transition: transform 420ms cubic-bezier(0.2, 0.7, 0.2, 1),
              color 320ms ease, letter-spacing 420ms cubic-bezier(0.2, 0.7, 0.2, 1);
}
.case .case-sub { font-family: var(--font-sans); font-size: 14px; color: var(--muted); max-width: 42ch; line-height: 1.55; }
.case .case-thumb {
  position: relative; aspect-ratio: 16 / 10;
  background: var(--bg-2); overflow: hidden; display: grid; place-items: center;
  transition: transform 620ms cubic-bezier(0.2, 0.7, 0.2, 1), filter 420ms ease;
  transform-origin: center;
}
.case .case-thumb img,
.case .case-thumb > svg {
  position: absolute; inset: 0; width: 100%; height: 100%;
  display: block; object-fit: cover;
  transition: transform 800ms cubic-bezier(0.2, 0.7, 0.2, 1), filter 420ms ease;
}
/* Stripe pattern — only when there's no cover image */
.case .case-thumb:not(.has-image)::before {
  content: ""; position: absolute; inset: 0;
  background-image: repeating-linear-gradient(45deg, transparent 0 8px, rgba(0,0,0,0.04) 8px 9px);
  transition: opacity 420ms ease;
}
/* Accent veil — over the image on hover */
.case .case-thumb::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(135deg,
    color-mix(in oklab, var(--accent) 26%, transparent) 0%,
    transparent 70%);
  opacity: 0; transition: opacity 520ms ease;
  mix-blend-mode: multiply;
  pointer-events: none;
}
.case:hover .case-thumb { filter: contrast(1.04); }
.case:hover .case-thumb img,
.case:hover .case-thumb > svg { transform: scale(1.045); }
.case:hover .case-thumb::after { opacity: 1; }
[data-theme="dark"] .case .case-thumb:not(.has-image)::before {
  background-image: repeating-linear-gradient(45deg, transparent 0 8px, rgba(255,255,255,0.06) 8px 9px);
}
.case .case-thumb .corner {
  position: absolute; width: 10px; height: 10px; border: 1px solid rgba(255,255,255,0.55);
  z-index: 2; mix-blend-mode: difference;
}
.case .case-thumb .corner.tl { top: 8px; left: 8px; border-right: 0; border-bottom: 0; }
.case .case-thumb .corner.tr { top: 8px; right: 8px; border-left: 0; border-bottom: 0; }
.case .case-thumb .corner.bl { bottom: 8px; left: 8px; border-right: 0; border-top: 0; }
.case .case-thumb .corner.br { bottom: 8px; right: 8px; border-left: 0; border-top: 0; }
.case .open-arrow {
  position: absolute; right: clamp(8px, 1.5vw, 20px); top: clamp(28px, 4vw, 44px);
  width: 44px; height: 44px; display: grid; place-items: center;
  border: 1px solid var(--line); border-radius: 50%;
  transition: transform 520ms cubic-bezier(0.2, 0.7, 0.2, 1),
              background 320ms ease, color 320ms ease, border-color 320ms ease;
  overflow: hidden;
}
.case .open-arrow svg {
  transition: transform 520ms cubic-bezier(0.2, 0.7, 0.2, 1);
}
.case:hover .open-arrow {
  background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
  transform: rotate(-45deg) scale(1.08);
}
.case:hover .open-arrow svg { transform: scale(1.1); }
/* Title — counter-intuitive small left-shift + tightened tracking gives the
   sense of the row "leaning in" toward the reader. Color shift is the payoff. */
.case:hover .case-title {
  color: var(--accent); letter-spacing: -0.03em;
  transform: translateX(-2px);
}
.case:hover .case-num { color: var(--accent); transform: translateX(-2px); }

/* ============================================================
   COLLAGE — two views: horizontal strip (default) + 3-column grid
   ============================================================ */
/* View toggle — small segmented control in the section head */
.collage-view-toggle {
  display: inline-flex; gap: 0;
  border: 1px solid var(--line);
  padding: 3px;
}
.collage-view-toggle button {
  width: 32px; height: 28px; display: grid; place-items: center;
  color: var(--muted);
  transition: background 220ms ease, color 220ms ease;
}
.collage-view-toggle button[aria-pressed="true"] {
  background: var(--fg); color: var(--bg);
}
.collage-view-toggle button:not([aria-pressed="true"]):hover { color: var(--fg); }
.collage-view-toggle svg { width: 14px; height: 14px; }

/* --- Horizontal strip (larger card variant) --- */
.collage-wrap { position: relative; margin: 0 calc(var(--pad-x) * -1); padding: 0 0 0 var(--pad-x); }
.collage-wrap-strip { padding-bottom: 4px; }
.collage-track {
  display: flex; gap: clamp(24px, 3vw, 40px); padding-right: var(--pad-x);
  overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
  -webkit-overflow-scrolling: touch; cursor: grab; user-select: none;
  align-items: stretch;
}
.collage-track.dragging { cursor: grabbing; scroll-snap-type: none; }
.collage-track::-webkit-scrollbar { display: none; }

/* The 'large' strip variant: each card is poster-tall with a meta block
   that breathes — name (bold), category line, and a one-line tagline below. */
.collage-card-large {
  width: clamp(380px, 38vw, 560px);
  height: clamp(560px, 70vh, 720px);
  flex: 0 0 auto;
  scroll-snap-align: start;
  display: grid;
  grid-template-rows: 1fr auto;
}
.collage-card-large .thumb { min-height: 0; }
.collage-card-large .meta-block {
  padding: clamp(18px, 2vw, 24px);
  display: flex; flex-direction: column; gap: 12px;
  border-top: 1px solid var(--line);
  background: var(--bg);
}
.collage-card-large .meta-block .meta-row {
  display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
  font-family: var(--font-mono);
  font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
}
.collage-card-large .meta-block .meta-row .name {
  font-family: var(--font-sans);
  font-size: clamp(15px, 1.3vw, 19px);
  font-weight: 500; letter-spacing: -0.015em;
  text-transform: none;
}
.collage-card-large .meta-block .meta-row .yr { color: var(--muted); }
.collage-card-large .meta-block .tagline {
  font-family: var(--font-sans);
  font-size: clamp(13px, 1vw, 15px);
  line-height: 1.5;
  letter-spacing: -0.005em;
  color: var(--muted);
  margin: 0;
  max-width: 38ch;
}
.collage-card-large .tagline em {
  font-family: var(--font-display); font-style: italic;
  color: var(--accent);
}

/* --- Brand marquee: 3 vertical auto-scrolling columns ---
   - Default view. Total height ~140vh, so the user moves past it in ~2 scrolls.
   - Each column animates Y from 0 to -50% (items are duplicated 1:1) so the
     loop is seamless. Three different durations create a subtle parallax —
     the eye can rest on any column without all three resetting together.
   - Soft mask on top + bottom edges hides the loop seams visually. */
.brand-marquee {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: clamp(16px, 2vw, 28px);
  height: clamp(720px, 140vh, 1400px);
  overflow: hidden;
  position: relative;
  -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 8%, #000 92%, transparent 100%);
          mask-image: linear-gradient(180deg, transparent 0%, #000 8%, #000 92%, transparent 100%);
}
.brand-col {
  display: flex; flex-direction: column;
  gap: clamp(16px, 2vw, 28px);
  will-change: transform, opacity;
  opacity: 0;
  transform: translateY(40px);
}
/* Animations only kick in when the section is observed in view ('.armed'),
   so the entrance lands as the user reaches the brand section, not on page load. */
.brand-marquee.armed .brand-col {
  animation:
    brand-enter 900ms cubic-bezier(0.2, 0.7, 0.2, 1) forwards,
    brand-vscroll 56s linear infinite;
}
.brand-marquee.armed .brand-col.col-1 { animation-delay: 0ms, 900ms; animation-duration: 900ms, 56s; }
.brand-marquee.armed .brand-col.col-2 { animation-delay: 140ms, 1100ms; animation-duration: 900ms, 72s; }
.brand-marquee.armed .brand-col.col-3 { animation-delay: 280ms, 1280ms; animation-duration: 900ms, 48s; }

.brand-marquee:hover .brand-col {
  animation-play-state: paused;
}

@keyframes brand-vscroll {
  from { transform: translateY(0); }
  to   { transform: translateY(-50%); }
}
@keyframes brand-enter {
  from { transform: translateY(40px); opacity: 0; }
  to   { transform: translateY(0); opacity: 1; }
}

.brand-card {
  width: 100% !important;
  height: auto !important;
  aspect-ratio: 4 / 5;
  flex-shrink: 0;
  /* Brand cards are pre-revealed (column-level enter animation handles it) */
  opacity: 1 !important;
  transform: none !important;
}

/* Strip view fallback grid (when no auto-scroll is wanted) */
.collage-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: clamp(16px, 2vw, 28px);
}
.collage-grid .collage-card {
  width: auto !important;
  height: auto !important;
  aspect-ratio: 4 / 5;
}

/* Shared card styles */
.collage-card {
  flex: 0 0 auto; scroll-snap-align: start; position: relative;
  background: var(--bg); border: 1px solid var(--line);
  display: flex; flex-direction: column;
  overflow: hidden;
  transition: transform 600ms cubic-bezier(0.2, 0.7, 0.2, 1),
              opacity 600ms ease, border-color 320ms ease;
  opacity: 0; transform: translateY(40px);
}
.collage-card.in { opacity: 1; transform: translateY(0); }
.collage-card .thumb {
  flex: 1; position: relative; overflow: hidden; background: var(--bg-2);
  display: grid; place-items: center;
}
.collage-card .thumb svg,
.collage-card .thumb img {
  width: 100%; height: 100%; display: block; object-fit: cover;
  transition: transform 800ms cubic-bezier(0.2, 0.7, 0.2, 1), filter 420ms ease;
}
/* Hover animation — image lifts and contrast bumps; reveal panel slides up */
.collage-card .reveal {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: clamp(14px, 2vw, 22px);
  background: var(--fg); color: var(--bg);
  transform: translateY(101%);
  transition: transform 520ms cubic-bezier(0.65, 0, 0.35, 1);
  display: flex; flex-direction: column; gap: 6px;
  pointer-events: none;
}
.collage-card .reveal .reveal-name {
  font-family: var(--font-sans);
  font-size: clamp(14px, 1.2vw, 18px); font-weight: 500;
  letter-spacing: -0.015em; line-height: 1.2;
}
.collage-card .reveal .reveal-cat {
  font-family: var(--font-mono);
  font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
  opacity: 0.6;
}
.collage-card .reveal .reveal-arrow {
  position: absolute; right: clamp(14px, 2vw, 22px); top: 50%;
  transform: translateY(-50%);
  color: var(--accent);
  font-size: 18px;
}
.collage-card:hover { border-color: var(--fg); }
.collage-card:hover .thumb img,
.collage-card:hover .thumb svg { transform: scale(1.05); filter: contrast(1.06); }
.collage-card:hover .reveal { transform: translateY(0); }

/* Default meta row (visible when reveal isn't shown — minimal & quiet) */
.collage-card .meta {
  padding: 12px 14px; display: flex; justify-content: space-between; align-items: baseline;
  font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
  border-top: 1px solid var(--line); background: var(--bg);
  transition: opacity 320ms ease;
}
.collage-card .meta .name { font-weight: 500; font-family: var(--font-mono); }
.collage-card .meta .yr { color: var(--muted); font-family: var(--font-mono); }

.collage-controls {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 28px; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
}
.collage-arrows { display: flex; gap: 8px; }
.collage-arrows button {
  width: 40px; height: 40px; border: 1px solid var(--line);
  display: grid; place-items: center; transition: background var(--transition), color var(--transition);
}
.collage-arrows button:hover { background: var(--fg); color: var(--bg); }
.collage-progress { flex: 1; height: 1px; background: var(--line); margin: 0 24px; position: relative; }
.collage-progress .bar { position: absolute; left: 0; top: 0; bottom: 0; background: var(--fg); width: 12%; }

/* ============================================================
   CONTACT — bold accent moment
   ============================================================ */
/* Contact — vermillion accent section. Subtle entry transition for the bg. */
.contact-section {
  background: var(--accent); color: var(--accent-ink);
  --fg: var(--accent-ink); --muted: rgba(15,10,7,0.62);
  --line: rgba(15,10,7,0.2); --line-strong: rgba(15,10,7,0.5);
  --bg: var(--accent); transition: background 600ms ease, color 600ms ease;
}
.contact-section .section-head { border-top-color: rgba(15,10,7,0.25); }
.contact-section .section-head .num,
.contact-section .section-head .meta { color: rgba(15,10,7,0.7); }
/* Contact — restructured as a vertical narrative:
   1. Bold lead (full width)
   2. Status strip with availability + clock + reply time
   3. Three large method tiles (email, phone, linkedin) — the primary call-to-action
   4. Slim inline note form — a single low-friction text box */
.contact { display: flex; flex-direction: column; gap: clamp(48px, 7vw, 96px); }

.contact-lead {
  font-family: var(--font-sans);
  /* Sized so the longest line ('worth the attention.') fits without
     forcing a wrap that collapses into the line above it. */
  font-size: clamp(40px, 6.4vw, 104px);
  font-weight: 500;
  /* 1.02 leading prevents lines from physically overlapping at scale */
  line-height: 1.02;
  letter-spacing: -0.04em;
  margin: 0;
  max-width: 16ch;
}
.contact-lead .serif {
  font-family: var(--font-display); font-style: italic;
  font-weight: 400; letter-spacing: -0.015em; padding: 0 0.04em;
}
/* Word-by-word reveal on viewport entry. Each word's .lh mask hides the
   .accent / .serif spans, then they slide up when the section gets .revealed.
   Stagger driven by --i. Slightly slower than the section-head reveal so it
   feels deliberate. */
.contact-lead-row { display: block; }
.contact-lead .lh {
  display: inline-block;
  overflow: hidden;
  vertical-align: baseline;
  /* a hair of room for descenders ('g' in 'something') so the mask doesn't clip */
  padding-bottom: 0.06em;
  line-height: inherit;
}
.contact-lead .lh > span {
  display: inline-block;
  transform: translateY(110%);
  transition: transform 720ms cubic-bezier(0.2, 0.7, 0.2, 1);
}
#contact.revealed .contact-lead .lh > span {
  transform: translateY(0);
  transition-delay: calc(var(--i, 0) * 90ms);
}
@media (prefers-reduced-motion: reduce) {
  .contact-lead .lh > span { transition: none; transform: none; }
}

.contact-lead .accent { color: var(--accent-ink); position: relative; display: inline-block; }
.contact-lead .accent::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0.04em;
  height: 6px; background: var(--accent-ink); opacity: 0.12;
  transform-origin: left; transition: transform 600ms cubic-bezier(0.7, 0, 0.2, 1);
}
.contact-lead .accent:hover::after { transform: scaleX(0.98) translateY(2px); opacity: 0.25; }

/* Status strip */
.contact-status {
  display: flex; flex-wrap: wrap; gap: clamp(24px, 4vw, 56px) clamp(32px, 5vw, 80px);
  align-items: baseline;
  border-top: 1px solid rgba(15,10,7,0.25);
  border-bottom: 1px solid rgba(15,10,7,0.25);
  padding: clamp(18px, 2vw, 24px) 0;
  font-family: var(--font-mono);
  font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
}
.contact-status .pair { display: flex; flex-direction: column; gap: 6px; }
.contact-status .pair .k { color: rgba(15,10,7,0.55); font-size: 10px; }
.contact-status .pair .v {
  color: var(--accent-ink); font-weight: 500; font-size: 13px;
  letter-spacing: 0.06em; display: inline-flex; align-items: center; gap: 8px;
}
.contact-status .status-pulse {
  width: 8px; height: 8px; border-radius: 50%; background: var(--accent-ink);
  box-shadow: 0 0 0 0 rgba(15,10,7,0.5); animation: pulse-ink 2.4s infinite;
}
@keyframes pulse-ink {
  0%   { box-shadow: 0 0 0 0 rgba(15,10,7,0.5); }
  70%  { box-shadow: 0 0 0 8px rgba(15,10,7,0); }
  100% { box-shadow: 0 0 0 0 rgba(15,10,7,0); }
}

/* Method tiles — three large cards */
.contact-methods {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: clamp(16px, 2vw, 24px);
}
.method-tile {
  position: relative;
  display: flex; flex-direction: column; gap: 24px;
  padding: clamp(24px, 3vw, 36px);
  border: 1.5px solid rgba(15,10,7,0.85);
  background: transparent;
  color: var(--accent-ink);
  overflow: hidden;
  transition: background 380ms ease, color 380ms ease, transform 520ms cubic-bezier(0.2, 0.7, 0.2, 1);
  min-height: 200px;
}
.method-tile::before {
  content: ""; position: absolute; inset: 0;
  background: var(--accent-ink);
  transform: translateY(101%);
  transition: transform 520ms cubic-bezier(0.7, 0, 0.2, 1);
  z-index: 0;
}
.method-tile > * { position: relative; z-index: 1; }
.method-tile:hover { color: var(--accent); transform: translateY(-3px); }
.method-tile:hover::before { transform: translateY(0); }
.method-tile .tile-head {
  display: flex; justify-content: space-between; align-items: flex-start;
  font-family: var(--font-mono);
  font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
}
.method-tile .tile-head .k { opacity: 0.6; }
.method-tile .tile-head .arrow {
  display: inline-block;
  transition: transform 420ms cubic-bezier(0.2, 0.7, 0.2, 1);
}
.method-tile:hover .tile-head .arrow { transform: translate(4px, -4px); }
.method-tile .tile-value {
  font-family: var(--font-sans);
  font-size: clamp(16px, 1.5vw, 22px);
  font-weight: 500; letter-spacing: -0.015em;
  line-height: 1.25;
  margin-top: auto;
  word-break: break-word;
}
.method-tile .tile-meta {
  font-family: var(--font-mono);
  font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
  opacity: 0.55;
}

/* Inline note form — single textarea + send. No name/email needed; mailto handles it. */
.contact-note {
  display: grid; grid-template-columns: 1fr auto; gap: 24px;
  align-items: end;
  padding-top: clamp(8px, 1.5vw, 16px);
}
.contact-note .note-label {
  font-family: var(--font-mono);
  font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
  color: rgba(15,10,7,0.55); margin-bottom: 12px;
  display: block;
}
.contact-note textarea {
  width: 100%; min-height: 64px; resize: vertical;
  font: inherit; font-family: var(--font-sans);
  font-size: clamp(18px, 1.6vw, 24px); line-height: 1.4;
  color: var(--accent-ink); background: transparent;
  border: 0; border-bottom: 1.5px solid rgba(15,10,7,0.4);
  padding: 8px 0 14px; outline: none;
  transition: border-color 280ms ease;
}
.contact-note textarea:focus { border-bottom-color: var(--accent-ink); }
.contact-note textarea::placeholder { color: rgba(15,10,7,0.4); }
.contact-note .submit {
  display: inline-flex; align-items: center; gap: 12px;
  padding: 14px 22px;
  font-family: var(--font-mono);
  font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
  font-weight: 500;
  border: 1.5px solid var(--accent-ink);
  background: transparent; color: var(--accent-ink);
  position: relative; overflow: hidden;
  transition: color 320ms ease;
  white-space: nowrap;
}
.contact-note .submit::before {
  content: ""; position: absolute; inset: 0;
  background: var(--accent-ink); transform: translateY(101%);
  transition: transform 420ms cubic-bezier(0.7, 0, 0.2, 1);
  z-index: 0;
}
.contact-note .submit:hover::before { transform: translateY(0); }
.contact-note .submit:hover { color: var(--accent); }
.contact-note .submit > * { position: relative; z-index: 1; }
.contact-note .submit .arrow { transition: transform 320ms ease; }
.contact-note .submit:hover .arrow { transform: translateX(4px); }

/* ============================================================
   FOOTER
   ============================================================ */
/* Footer — 3-column nav anchored by a statement wordmark.
   Wordmark scaled down from 88px to prevent it dominating the supporting content (repetition principle). */
.footer {
  border-top: 1px solid var(--line);
  padding: clamp(40px, 6vw, 72px) var(--pad-x) clamp(24px, 3vw, 40px);
  display: grid; grid-template-columns: 1.6fr 1fr 1fr 1fr; gap: clamp(24px, 4vw, 48px); font-size: 12px;
  align-items: start;
}
.footer .brand-block { display: flex; flex-direction: column; gap: 16px; }
.footer .brand-block .wm {
  /* Scaled to be prominent but not overwhelming — roughly 3× the body text */
  font-size: clamp(32px, 5vw, 60px); font-weight: 500;
  letter-spacing: -0.04em; line-height: 0.92;
  display: inline-flex; align-items: baseline;
  color: var(--fg);
  cursor: default;
}
.wm-ch {
  display: inline-block;
  font-variation-settings: "wght" 500;
  transition:
    transform 700ms cubic-bezier(0.2, 0.7, 0.2, 1),
    font-variation-settings 700ms cubic-bezier(0.2, 0.7, 0.2, 1),
    color 360ms ease;
  transition-delay: 0ms;
  will-change: transform, font-variation-settings;
}
.wm-dot {
  display: inline-block;
  width: 0.18em; height: 0.18em;
  background: currentColor;
  margin: 0 0.07em 0 0.07em;
  vertical-align: 0.16em;
  transition:
    transform 600ms cubic-bezier(0.2, 0.7, 0.2, 1),
    background 320ms ease,
    border-radius 600ms cubic-bezier(0.2, 0.7, 0.2, 1);
  will-change: transform, background;
}
/* Hover the wordmark — a "weight wave" rolls L→R: each letter pulses up to
   variable weight 800 and lifts a hair, in a 60ms stagger. The middle dot
   becomes accent, rotates 45° and rounds, like a vermillion lozenge. */
.footer .wm:hover .wm-ch {
  font-variation-settings: "wght" 820;
  transform: translateY(-3px);
  transition-delay: calc(var(--i, 0) * 55ms);
}
.footer .wm:hover .wm-ch:nth-child(n+6) {
  /* The UIXUX half tints to accent at the end of the wave */
  color: var(--accent);
}
.footer .wm:hover .wm-dot {
  background: var(--accent);
  transform: rotate(45deg) scale(1.6);
  border-radius: 2px;
}
@media (prefers-reduced-motion: reduce) {
  .wm-ch, .wm-dot, .logo-text .lt-ch { transition: none; }
}
.footer .col { display: flex; flex-direction: column; gap: 10px; }
.footer .col .hd {
  font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 6px; font-weight: 600;
}
.footer .col a { position: relative; display: inline-block; color: var(--muted-2); }
.footer .col a:hover { color: var(--fg); text-decoration: underline; text-underline-offset: 4px; }
.footer .col span { color: var(--muted-2); }
.footer-bottom {
  grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center;
  font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted);
  margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--line);
}

/* ============================================================
   ONBOARDING BUBBLES
   ============================================================ */
/* Hide onboarding bubbles on touch/small viewports — they reference hover-only
   elements (rail, theme toggle) and overflow the screen on phones. */
@media (max-width: 900px), (hover: none), (pointer: coarse) {
  .bubble { display: none !important; }
}
.bubble {
  position: fixed; background: var(--bubble-bg); color: var(--bubble-fg);
  padding: 10px 14px; font-size: 11px; letter-spacing: 0.04em; z-index: 200;
  max-width: 240px; line-height: 1.4; cursor: pointer; opacity: 0;
  transform: translateY(6px); transition: opacity 380ms ease, transform 380ms ease;
  pointer-events: none; box-shadow: 0 10px 30px rgba(0,0,0,0.18);
}
.bubble.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
.bubble .close { display: inline-block; margin-left: 8px; opacity: 0.6; }
.bubble::before {
  content: ""; position: absolute; width: 10px; height: 10px;
  background: var(--bubble-bg); transform: rotate(45deg);
}
.bubble.from-top::before { top: -4px; left: 18px; }
.bubble.from-left::before { left: -4px; top: 18px; }

/* ============================================================
   SCROLL PROGRESS BAR — hairline that fills as you scroll
   ============================================================ */
.scroll-progress {
  position: fixed; top: 0; left: 0; right: 0;
  height: 2px;
  z-index: 70; /* above topnav transitions */
  background: transparent;
  pointer-events: none;
}
.scroll-progress-bar {
  height: 100%; width: 100%;
  background: var(--accent);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 80ms linear;
}

/* ============================================================
   SECTION-HEAD LETTER REVEAL — uniform mask-up on viewport entry
   ============================================================ */
/* Each word is its own inline-block — keeps letters together as a unit so
   normal text wrap happens BETWEEN words, never INSIDE one. */
.lr-word {
  display: inline-block;
  white-space: nowrap;
}
.section-head h2 .lh {
  display: inline-block; overflow: hidden;
  /* Vertical-align baseline + a little extra padding so descenders aren't
     clipped by the overflow:hidden mask. */
  vertical-align: baseline;
  padding-bottom: 0.04em;
}
.section-head h2 .lh > span {
  display: inline-block;
  transform: translateY(110%);
  transition: transform 600ms cubic-bezier(0.2, 0.7, 0.2, 1);
}
section.revealed .section-head h2 .lh > span {
  transform: translateY(0);
  transition-delay: calc(var(--i, 0) * 22ms);
}
@media (prefers-reduced-motion: reduce) {
  .section-head h2 .lh > span { transition: none; transform: none; }
}

/* ============================================================
   GRID REVEAL — designer x-ray (press G) + click-to-flash column
   ============================================================
   The site is built on a 12-column Müller-Brockmann grid. The
   overlay paints that grid (and the 8pt baseline as a subtle
   horizontal pattern) in accent at low opacity, so the bones
   of every layout decision become legible. Quiet, hidden,
   designer-relevant — meant to be discovered, not used. */

.grid-overlay {
  position: fixed;
  top: 0; bottom: 0;
  left: var(--pad-x);
  right: var(--pad-x);
  z-index: 8000;
  pointer-events: none;
  opacity: 0;
  transition: opacity 360ms cubic-bezier(0.2, 0.7, 0.2, 1);
}
.grid-overlay-cols {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: clamp(16px, 1.6vw, 24px);
  height: 100%;
}
.grid-overlay-cols > span {
  background: color-mix(in oklab, var(--accent) 8%, transparent);
  border-left: 1px solid color-mix(in oklab, var(--accent) 35%, transparent);
  border-right: 1px solid color-mix(in oklab, var(--accent) 35%, transparent);
}
/* 8pt baseline rhythm as a faint horizontal repeating pattern */
.grid-overlay::before {
  content: ""; position: absolute; inset: 0;
  background-image: repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent 7px,
    color-mix(in oklab, var(--accent) 16%, transparent) 7px,
    color-mix(in oklab, var(--accent) 16%, transparent) 8px
  );
  pointer-events: none;
}
body.grid-mode .grid-overlay { opacity: 1; }
@supports not (background: color-mix(in oklab, red 10%, transparent)) {
  /* Fallback for older browsers — just use a translucent accent */
  .grid-overlay-cols > span { background: rgba(233,75,26,0.08); border-color: rgba(233,75,26,0.35); }
}

/* Mode badge — mono pill bottom-center when grid mode is on */
.grid-mode-badge {
  position: fixed; left: 50%;
  bottom: clamp(24px, 4vw, 48px);
  transform: translateX(-50%) translateY(8px);
  background: var(--fg); color: var(--bg);
  padding: 10px 14px;
  font-family: var(--font-mono);
  font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
  z-index: 8001;
  display: inline-flex; align-items: center; gap: 12px;
  opacity: 0; pointer-events: none;
  transition: opacity 320ms ease, transform 320ms cubic-bezier(0.2, 0.7, 0.2, 1);
  box-shadow: 0 8px 24px rgba(0,0,0,0.18);
}
.grid-mode-badge.show {
  opacity: 1; transform: translateX(-50%) translateY(0);
}
.grid-mode-badge .gm-label { color: var(--accent); }
.grid-mode-badge .gm-key { opacity: 0.6; }
.grid-mode-badge kbd {
  display: inline-block;
  padding: 2px 6px; margin: 0 2px;
  border: 1px solid currentColor; border-radius: 3px;
  font-family: inherit; font-size: 9px;
  color: var(--bg);
}

/* Click-to-flash: a thin vertical accent strip blooms at the click x.
   Tells you which "column" you clicked in without committing to the
   full grid mode. Auto-removes after the keyframe. */
.grid-flash {
  position: fixed;
  top: 0; bottom: 0;
  width: 28px;
  background: color-mix(in oklab, var(--accent) 14%, transparent);
  border-left: 1px solid color-mix(in oklab, var(--accent) 60%, transparent);
  border-right: 1px solid color-mix(in oklab, var(--accent) 60%, transparent);
  transform: translateX(-50%);
  pointer-events: none;
  z-index: 7999;
  animation: grid-flash 1200ms cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
}
@supports not (background: color-mix(in oklab, red 10%, transparent)) {
  .grid-flash { background: rgba(233,75,26,0.14); border-color: rgba(233,75,26,0.6); }
}
@keyframes grid-flash {
  0%   { opacity: 0; transform: translateX(-50%) scaleY(0.92); }
  18%  { opacity: 1; transform: translateX(-50%) scaleY(1); }
  100% { opacity: 0; transform: translateX(-50%) scaleY(1); }
}

@media (max-width: 900px), (hover: none), (pointer: coarse) {
  .grid-flash, .grid-overlay, .grid-mode-badge { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .grid-flash { animation-duration: 400ms; }
  .grid-overlay, .grid-mode-badge { transition: none; }
}

/* ============================================================
   EASTER EGGS + MICRO-ANIMATIONS
   ============================================================ */
/* Konami toast — bottom-left, mono type, fades in/out */
.konami-toast {
  position: fixed; left: clamp(20px, 3vw, 36px);
  bottom: clamp(20px, 3vw, 36px); z-index: 90;
  display: inline-flex; align-items: center; gap: 12px;
  padding: 10px 16px;
  background: var(--fg); color: var(--bg);
  font-family: var(--font-mono);
  font-size: 11px; letter-spacing: 0.08em;
  opacity: 0; transform: translateY(8px);
  transition: opacity 320ms ease, transform 320ms cubic-bezier(0.2, 0.7, 0.2, 1);
  pointer-events: none;
  max-width: 360px;
}
.konami-toast.show { opacity: 1; transform: translateY(0); }
.konami-toast .dot {
  color: var(--accent); font-size: 9px;
  animation: pulse 2.4s infinite;
}
.konami-toast em {
  font-family: var(--font-display); font-style: italic;
  font-size: 1.2em; color: var(--accent);
}

/* Logo-mark — micro-wiggle on hover (subtle "alive" cue) */
.logo:hover .logo-mark span {
  display: inline-block;
  animation: wiggle 600ms cubic-bezier(0.2, 0.7, 0.2, 1);
}
@keyframes wiggle {
  0%, 100% { transform: rotate(0); }
  30%      { transform: rotate(-12deg); }
  60%      { transform: rotate(8deg); }
  80%      { transform: rotate(-3deg); }
}

/* Footer year-cycle easter egg — click to step through design-history landmarks.
   Visually identical to the static © line until hovered. */
.footer-year-egg {
  display: inline-flex; align-items: baseline; gap: 8px;
  font: inherit;
  font-family: var(--font-mono);
  color: inherit;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  background: transparent; border: 0; padding: 0; cursor: pointer;
  position: relative;
}
.footer-year-egg .y { font-variant-numeric: tabular-nums; }
.footer-year-egg .dot { color: var(--muted-2); }
.footer-year-egg .n {
  text-transform: none; letter-spacing: 0.02em;
  color: var(--muted);
  font-size: 10px;
}
.footer-year-egg .hint {
  position: absolute; top: -2px; right: -14px;
  font-size: 10px; color: var(--accent);
  animation: hint-tick 1.8s ease-in-out 2s 3;
  opacity: 0;
}
@keyframes hint-tick {
  0%, 100% { opacity: 0; transform: rotate(0); }
  20%      { opacity: 1; transform: rotate(360deg); }
  80%      { opacity: 1; transform: rotate(360deg); }
}
.footer-year-egg:hover .y { color: var(--accent); }
.footer-year-egg:hover .n { color: var(--fg); }

/* Logo-mark hover tooltip — references Akzidenz-Grotesk (the typeface
   ancestor of Helvetica, designed 1898). Subtle, only on hover-capable. */
@media (hover: hover) and (pointer: fine) {
  .topnav .logo .logo-mark { position: relative; }
  .topnav .logo .logo-mark::before {
    content: "Akzidenz, 1898.";
    position: absolute;
    left: 50%; top: calc(100% + 10px);
    transform: translateX(-50%) translateY(-4px);
    background: var(--fg); color: var(--bg);
    font-family: var(--font-mono);
    font-size: 9px; letter-spacing: 0.12em; text-transform: none;
    padding: 5px 8px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 320ms ease, transform 320ms cubic-bezier(0.2, 0.7, 0.2, 1);
    transition-delay: 600ms; /* a beat — feels considered, not noisy */
  }
  .topnav .logo .logo-mark:hover::before {
    opacity: 0.9;
    transform: translateX(-50%) translateY(0);
  }
  .topnav.on-accent .logo .logo-mark::before {
    background: var(--accent-ink); color: var(--accent);
  }
}

/* Hero period — pulses outward on hover, a small ripple of accent */
.intro-text .period {
  position: relative; cursor: pointer;
}
.intro-text .period::after {
  content: ""; position: absolute;
  inset: -4px; border-radius: 50%;
  border: 1.5px solid var(--accent);
  opacity: 0; transform: scale(0.6);
  pointer-events: none;
}
.intro-text .period:hover::after {
  animation: period-ping 900ms cubic-bezier(0.2, 0.7, 0.2, 1);
}
@keyframes period-ping {
  0%   { opacity: 0.9; transform: scale(0.6); }
  100% { opacity: 0;   transform: scale(2.4); }
}

/* ============================================================
   SCROLL-TO-TOP — bottom-right pill, fades in after the fold
   ============================================================ */
.scroll-top {
  position: fixed; right: clamp(20px, 3vw, 36px);
  bottom: clamp(20px, 3vw, 36px);
  z-index: 80;
  width: 44px; height: 44px;
  display: grid; place-items: center;
  border: 1.5px solid var(--fg);
  background: var(--bg); color: var(--fg);
  border-radius: 50%;
  opacity: 0; transform: translateY(8px) scale(0.92);
  pointer-events: none;
  transition: opacity 320ms ease, transform 320ms cubic-bezier(0.2, 0.7, 0.2, 1),
              background 220ms ease, color 220ms ease;
}
.scroll-top.shown { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
.scroll-top:hover { background: var(--fg); color: var(--bg); }
.scroll-top svg { width: 14px; height: 14px; }
/* Tiny breathing pulse — only on hover, so it doesn't compete with the
   pulse dot on the CTA */
.scroll-top:hover svg { animation: top-bob 1.4s ease-in-out infinite; }
@keyframes top-bob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-2px); }
}

/* ============================================================
   FLOATING CURSOR — pursuit ring + small dot
   ============================================================ */
/* Only render on devices with precise hover — phones/tablets use the OS cursor */
@media (hover: hover) and (pointer: fine) {
  /* Hide native cursor on interactive elements so the floating one is the only signal.
     Keep native for text inputs (caret matters there). */
  html, body { cursor: none; }
  a, button, [role="button"], .case, .collage-card, .rail-item, .hamburger,
  .theme-toggle, .cta, .topnav-center a, .submit, .method-tile, summary, label {
    cursor: none;
  }
  textarea, input[type="text"], input[type="email"], input[type="tel"],
  input[type="search"], [contenteditable="true"] {
    cursor: text; /* native I-beam for text — floating cursor matches it */
  }
}

.fcursor-ring,
.fcursor-dot {
  position: fixed; left: 0; top: 0;
  pointer-events: none;
  z-index: 9999;
  opacity: 0;
  will-change: transform, width, height, background;
}
.fcursor-ring {
  width: 32px; height: 32px; border-radius: 50%;
  border: 1.5px solid var(--fg);
  background: transparent;
  transition:
    width 220ms cubic-bezier(0.2, 0.7, 0.2, 1),
    height 220ms cubic-bezier(0.2, 0.7, 0.2, 1),
    border-radius 220ms cubic-bezier(0.2, 0.7, 0.2, 1),
    border-color 220ms ease,
    background 220ms ease,
    opacity 220ms ease;
  mix-blend-mode: difference; /* keeps the ring readable over any bg */
  border-color: rgba(255,255,255,0.85);
}
.fcursor-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--accent);
  transition:
    width 200ms cubic-bezier(0.2, 0.7, 0.2, 1),
    height 200ms cubic-bezier(0.2, 0.7, 0.2, 1),
    background 220ms ease,
    opacity 220ms ease;
}

/* Over a link / button → ring grows and fills */
.fcursor-ring[data-kind="link"] {
  width: 56px; height: 56px;
  border-color: rgba(255,255,255,0.95);
  background: rgba(255,255,255,0.06);
}
.fcursor-dot[data-kind="link"] {
  width: 8px; height: 8px; background: var(--accent);
}

/* Over the orange contact section → cursor tints to ink for contrast */
.fcursor-ring[data-kind="accent"],
.fcursor-ring[data-kind="accent-link"] {
  mix-blend-mode: normal;
  border-color: var(--accent-ink);
}
.fcursor-ring[data-kind="accent-link"] {
  width: 56px; height: 56px;
  background: rgba(15,10,7,0.08);
}
.fcursor-dot[data-kind="accent"],
.fcursor-dot[data-kind="accent-link"] {
  background: var(--accent-ink);
}

/* Text input → hide the floating cursor entirely; native I-beam is the truth */
.fcursor-ring[data-kind="text"],
.fcursor-dot[data-kind="text"] {
  opacity: 0 !important;
}

/* Pressed state — small inward pinch */
.fcursor-ring[data-pressed="true"] {
  width: 22px; height: 22px;
}
.fcursor-ring[data-kind="link"][data-pressed="true"] {
  width: 44px; height: 44px;
}

@media (prefers-reduced-motion: reduce) {
  .fcursor-ring, .fcursor-dot { transition: none; }
}

/* ============================================================
   TWEAKS PANEL
   ============================================================ */
.tweaks-host { font-family: var(--font-mono); }

/* ============================================================
   SECTION REVEAL — Intersection-based fade-up for non-hero sections
   ============================================================ */
section:not(#hero) .section-head {
  opacity: 0; transform: translateY(16px);
  transition: opacity 600ms ease, transform 600ms cubic-bezier(0.2, 0.7, 0.2, 1);
}
section:not(#hero).revealed .section-head {
  opacity: 1; transform: translateY(0);
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 900px) {
  .siderail { display: none; }
  .topnav-center { display: none; }
  .hamburger { display: flex; }
  .topnav .cta { display: none; }
  /* Reserve room for the fixed hamburger so the theme-toggle doesn't sit on top of it */
  .topnav-right { margin-right: 52px; }
  .hero-footer { grid-template-columns: 1fr 1fr; }
  .case { grid-template-columns: 1fr; gap: 16px; }
  .case .case-num { padding-top: 0; }
  .case .open-arrow { display: none; }
  .contact-methods { grid-template-columns: 1fr; }
  .contact-note { grid-template-columns: 1fr; gap: 16px; }
  .contact-note .submit { justify-self: start; }
  .collage-grid { grid-template-columns: 1fr 1fr; }
  .footer { grid-template-columns: 1fr 1fr; }

  /* Section-head: stack the title block above the meta on the right —
     keeps the view toggle from getting jammed against the heading. */
  .section-head {
    flex-direction: column;
    align-items: flex-start;
    gap: 14px;
    padding-top: 20px;
  }
  .section-head .meta { text-align: left; }

  /* Brand 3-col marquee → single column, shorter container.
     Auto-scroll still runs but only on one track. */
  .brand-marquee {
    grid-template-columns: 1fr !important;
    height: clamp(560px, 120vh, 1000px);
  }
  .brand-marquee .brand-col.col-2,
  .brand-marquee .brand-col.col-3 { display: none; }

  /* Strip cards: snap to viewport width, no awkward 480px overflow */
  .collage-card-large {
    width: clamp(280px, 84vw, 420px);
    height: clamp(440px, 80vh, 600px);
  }

  /* Contact lead: smaller cap so 'attention.' fits, looser line so words
     don't collide when wrapping forces an extra line. */
  .contact-lead {
    font-size: clamp(36px, 9vw, 64px);
    line-height: 1.04;
    max-width: 18ch;
  }

  /* Hero subhead — tighter so it sits closer to the headline on phones */
  .hero-sub { margin-top: clamp(20px, 4vw, 28px); }
}
@media (max-width: 560px) {
  /* Collage grid view: single column */
  .collage-grid { grid-template-columns: 1fr; }

  /* Tighter, balanced header on phones */
  .topnav { padding-left: 20px; padding-right: 20px; gap: 12px; }
  .topnav .logo { font-size: 12px; letter-spacing: 0.05em; }
  .logo-mark { width: 26px; height: 26px; font-size: 10px; }
  .hamburger { right: 20px; width: 36px; height: 36px; }
  .topnav-right { margin-right: 44px; gap: 12px; }
  .theme-toggle { width: 30px; height: 30px; }
  .mobile-menu { padding-left: 20px; padding-right: 20px; }
  .hero-footer { grid-template-columns: 1fr; }
  .footer { grid-template-columns: 1fr; }
  .footer-bottom { flex-direction: column; gap: 12px; align-items: flex-start; }

  /* Hero headline — smaller cap, looser leading so descenders don't clip */
  .intro-text { font-size: clamp(28px, 8.4vw, 44px); line-height: 1.12; }

  /* Contact: status strip + method tiles get more breathing room */
  .contact-status { gap: 16px 32px; padding: 14px 0; }
  .method-tile { min-height: 160px; padding: 20px; }

<script type="text/babel">
const __TWEAKS_STYLE = `
  .twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:280px;
    max-height:calc(100vh - 32px);display:flex;flex-direction:column;
    transform:scale(var(--dc-inv-zoom,1));transform-origin:bottom right;
    background:rgba(250,249,247,.78);color:#29261b;
    -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
    border:.5px solid rgba(255,255,255,.6);border-radius:14px;
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 12px 40px rgba(0,0,0,.18);
    font:11.5px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}
  .twk-hd{display:flex;align-items:center;justify-content:space-between;
    padding:10px 8px 10px 14px;cursor:move;user-select:none}
  .twk-hd b{font-size:12px;font-weight:600;letter-spacing:.01em}
  .twk-x{appearance:none;border:0;background:transparent;color:rgba(41,38,27,.55);
    width:22px;height:22px;border-radius:6px;cursor:default;font-size:13px;line-height:1}
  .twk-x:hover{background:rgba(0,0,0,.06);color:#29261b}
  .twk-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;
    overflow-y:auto;overflow-x:hidden;min-height:0;}
  .twk-row{display:flex;flex-direction:column;gap:5px}
  .twk-row-h{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
  .twk-lbl{display:flex;justify-content:space-between;align-items:baseline;color:rgba(41,38,27,.72)}
  .twk-lbl>span:first-child{font-weight:500}
  .twk-sect{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:rgba(41,38,27,.45);padding:10px 0 0}
  .twk-field{appearance:none;box-sizing:border-box;width:100%;min-width:0;height:26px;padding:0 8px;
    border:.5px solid rgba(0,0,0,.1);border-radius:7px;
    background:rgba(255,255,255,.6);color:inherit;font:inherit;outline:none}
  .twk-seg{position:relative;display:flex;padding:2px;border-radius:8px;
    background:rgba(0,0,0,.06);user-select:none}
  .twk-seg-thumb{position:absolute;top:2px;bottom:2px;border-radius:6px;
    background:rgba(255,255,255,.9);box-shadow:0 1px 2px rgba(0,0,0,.12);
    transition:left .15s cubic-bezier(.3,.7,.4,1),width .15s}
  .twk-seg button{appearance:none;position:relative;z-index:1;flex:1;border:0;
    background:transparent;color:inherit;font:inherit;font-weight:500;min-height:22px;
    border-radius:6px;cursor:default;padding:4px 6px;line-height:1.2}
  .twk-toggle{position:relative;width:32px;height:18px;border:0;border-radius:999px;
    background:rgba(0,0,0,.15);transition:background .15s;cursor:default;padding:0}
  .twk-toggle[data-on="1"]{background:#34c759}
  .twk-toggle i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
    background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
  .twk-toggle[data-on="1"] i{transform:translateX(14px)}
  .twk-btn{appearance:none;height:26px;padding:0 12px;border:0;border-radius:7px;
    background:rgba(0,0,0,.78);color:#fff;font:inherit;font-weight:500;cursor:default}
  .twk-btn:hover{background:rgba(0,0,0,.88)}
`;

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    offsetRef.current = {
      x: Math.min(Math.max(PAD, window.innerWidth - w - PAD), Math.max(PAD, offsetRef.current.x)),
      y: Math.min(Math.max(PAD, window.innerHeight - h - PAD), Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    const onMsg = (e) => {
      if (e?.data?.type === '__activate_edit_mode') setOpen(true);
      else if (e?.data?.type === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = { x: startRight - (ev.clientX - sx), y: startBottom - (ev.clientY - sy) };
      clampToViewport();
    };
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" onClick={() => { setOpen(false); window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); }}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ title, label, children }) {
  return (<><div className="twk-sect">{title || label}</div>{children}</>);
}

function TweakRadio({ label, value, options, onChange }) {
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => { if (!trackRef.current) return; const v = segAt(ev.clientX); if (v !== valueRef.current) onChange(v); };
    const up = () => { setDragging(false); window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <div className="twk-row" style={{ gap: 5 }}>
      <div className="twk-lbl"><span>{label}</span></div>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`, width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>{o.label}</button>
        ))}
      </div>
    </div>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value} onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakButton({ label, onClick, children, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'} onClick={onClick}>
      {label || children}
    </button>
  );
}

Object.assign(window, { useTweaks, TweaksPanel, TweakSection, TweakRadio, TweakToggle, TweakButton });
</script>

<script type="text/babel">
const { useEffect, useState, useRef, useCallback } = React;

function useTheme(forceMode) {
  function autoTheme() {
    const h = new Date().getHours();
    return h >= 19 || h < 6 ? "dark" : "light";
  }

  const [theme, setTheme] = useState(() => {
    const stored = localStorage.getItem("adi-theme");
    if (stored === "light" || stored === "dark") return stored;
    return autoTheme();
  });
  const [mode, setMode] = useState(() => localStorage.getItem("adi-theme-mode") || "auto");

  useEffect(() => {
    if (forceMode && forceMode !== "auto") { setTheme(forceMode); setMode(forceMode); return; }
    if (mode === "auto") setTheme(autoTheme());
    else setTheme(mode);
  }, [mode, forceMode]);

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem("adi-theme", theme);
    localStorage.setItem("adi-theme-mode", mode);
  }, [theme, mode]);

  const cycle = useCallback(() => {
    setMode((m) => (m === "auto" ? "light" : m === "light" ? "dark" : "auto"));
  }, []);

  return { theme, mode, setMode, cycle };
}

function useScrollSpy(ids) {
  const [active, setActive] = useState(ids[0]);
  useEffect(() => {
    const handler = () => {
      const y = window.scrollY + window.innerHeight * 0.35;
      let found = ids[0];
      for (const id of ids) {
        const el = document.getElementById(id);
        if (!el) continue;
        if (el.offsetTop <= y) found = id;
      }
      setActive(found);
    };
    handler();
    window.addEventListener("scroll", handler, { passive: true });
    window.addEventListener("resize", handler);
    return () => { window.removeEventListener("scroll", handler); window.removeEventListener("resize", handler); };
  }, [ids.join(",")]);
  return { active };
}

function useToneBlend(baseTheme) {
  useEffect(() => {
    document.documentElement.setAttribute("data-theme", baseTheme);
    const root = document.documentElement;
    const handler = () => {
      const total = document.documentElement.scrollHeight - window.innerHeight;
      const p = total > 0 ? Math.min(1, window.scrollY / total) : 0;
      root.style.setProperty("--scroll-progress", p.toFixed(3));
    };
    handler();
    window.addEventListener("scroll", handler, { passive: true });
    return () => window.removeEventListener("scroll", handler);
  }, [baseTheme]);
}

Object.assign(window, { useTheme, useScrollSpy, useToneBlend });
</script>
